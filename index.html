function exportWordCards(){
    const payload={_type:'lingji_wordcards',_version:1,_exportedAt:new Date().toISOString(),groups:data.wordCards.groups||[]};
    const json=JSON.stringify(payload,null,2);
    try{
        const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download='悸动_字卡备份_'+new Date().toISOString().slice(0,10)+'.json';a.style.display='none';document.body.appendChild(a);a.click();
        setTimeout(()=>{try{document.body.removeChild(a);URL.revokeObjectURL(url);}catch(e){}},1500);
        showToast('字卡备份已导出');return;
    }catch(e){}
    showModal('导出字卡备份','<div class="setting-sub">下载失败，请点击"全选"后长按复制</div><textarea id="wcExportText" rows="14" readonly style="width:100%;font-size:11px;font-family:ui-monospace,Menlo,monospace;">'+esc(json)+'</textarea><div class="modal-actions"><button class="btn-cancel" onclick="selectWCExportText()">全选</button><button class="btn-confirm" onclick="copyWCExportText()">复制</button><button class="btn-cancel" onclick="closeModal()">关闭</button></div>');
}
function selectWCExportText(){const ta=document.getElementById('wcExportText');if(ta){ta.select();ta.setSelectionRange(0,999999);}}
function copyWCExportText(){const ta=document.getElementById('wcExportText');if(!ta) return;ta.select();ta.setSelectionRange(0,999999);try{if(document.execCommand('copy')){showToast('✅ 已复制');return;}}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>showToast('✅ 已复制')).catch(()=>showToast('复制失败'));}
function importWordCards(){
    const input=document.createElement('input');input.type='file';input.accept='application/json,.json';
    input.onchange=function(e){
        const file=e.target.files[0];if(!file) return;
        const reader=new FileReader();
        reader.onload=function(ev){
            try{
                const parsed=JSON.parse(ev.target.result);
                let groups=null;
                if(Array.isArray(parsed)) groups=parsed;
                else if(parsed&&Array.isArray(parsed.groups)) groups=parsed.groups;
                else if(parsed&&parsed.wordCards&&Array.isArray(parsed.wordCards.groups)) groups=parsed.wordCards.groups;
                if(!groups){showToast('⚠️ 文件格式不正确');return;}
                showModal('导入字卡','<div class="setting-sub">文件中包含 <b>'+groups.length+'</b> 个分组。请选择导入方式：</div><div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;"><button class="btn-primary" style="justify-content:center;" onclick="doImportWC(\'merge\')">➕ 合并到现有字卡</button><button class="btn-danger" style="justify-content:center;" onclick="doImportWC(\'replace\')">🔄 覆盖现有字卡</button><button class="btn-outline" style="justify-content:center;" onclick="closeModal()">取消</button></div>');
                window._pendingWCImport=groups;
            }catch(err){showToast('⚠️ 数据解析失败');}
        };
        reader.readAsText(file);
    };
    input.click();
}
function doImportWC(mode){
    const groups=window._pendingWCImport;if(!groups){closeModal();return;}
    if(mode==='replace'){
        if(!confirm('确定要覆盖现有全部字卡吗？此操作不可恢复！')) return;
        data.wordCards.groups=groups.map(g=>({id:genId(),name:g.name||'未命名分组',disabled:!!g.disabled,cards:Array.isArray(g.cards)?g.cards.map(c=>({id:genId(),word:typeof c==='string'?c:(c.word||''),disabled:typeof c==='object'&&c?!!c.disabled:false})).filter(c=>c.word):[]}));
    }else{
        groups.forEach(g=>{
            const name=g.name||'未命名分组';
            const incoming=Array.isArray(g.cards)?g.cards.map(c=>(typeof c==='string'?{word:c,disabled:false}:{word:(c&&c.word)||'',disabled:!!(c&&c.disabled)})).filter(c=>c.word):[];
            let existing=data.wordCards.groups.find(x=>x.name===name);
            if(!existing){existing={id:genId(),name,disabled:false,cards:[]};data.wordCards.groups.push(existing);}
            const existedWords=new Set(existing.cards.map(c=>c.word));
            incoming.forEach(item=>{if(!existedWords.has(item.word)){existing.cards.push({id:genId(),word:item.word,disabled:item.disabled});existedWords.add(item.word);}});
        });
    }
    dedupeWordCards();saveData();closeModal();renderWordCardPage();
    window._pendingWCImport=null;showToast('✅ 字卡导入成功');
}

              '<button class="btn-outline" style="color:#ef4444;border-color:#fecaca;" onclick="enterCardBatchMode(\''+groupId+'\')">☑️ 批量删除</button>'+
              '<button class="btn-outline" onclick="toggleGroupDisabled(\''+groupId+'\')">'+(group.disabled?'✅ 启用分组':'🚫 停用分组')+'</button>';

    if(cards.length===0) html+='<div class="empty-state"><div class="empty-icon">📝</div><div>这个分组还没有字卡</div></div>';
    else{
        cards.forEach(c=>{
            if(cardBatchMode){
                const sel=cardBatchSelected.has(c.id);

            }else{
                html+='<div class="word-card-item'+(c.disabled?' disabled':'')+'"><span class="card-word">'+esc(c.word)+'</span><div class="card-actions"><button onclick="toggleCardDisabled(\''+groupId+'\',\''+c.id+'\')" title="'+(c.disabled?'启用':'停用')+'">'+(c.disabled?'✅':'🚫')+'</button><button onclick="editCard(\''+groupId+'\',\''+c.id+'\')">✎</button><button onclick="deleteCard(\''+groupId+'\',\''+c.id+'\')">🗑</button></div></div>';
            }
        });
    }
    body.innerHTML=html;
}
function showQuickAddCard(){
    const groups=data.wordCards.groups;

function confirmQuickAdd(){
    const groupId=document.getElementById('quickGroupSelect').value;
    const input=document.getElementById('quickCardInput').value;
    const words=input.split(/[,，\n]+/).map(s=>s.trim()).filter(Boolean);

/* ===================== 自动消息 ===================== */
function scheduleAutoMessage(){
    scheduler.cancelByKey('autoMsg');
    if(!data.replySettings.autoMsgEnabled) return;
    let minM=Number(data.replySettings.autoMsgMinMinutes),maxM=Number(data.replySettings.autoMsgMaxMinutes);
    if(isNaN(minM)||minM<0.1) minM=5;
    if(isNaN(maxM)||maxM<0.1) maxM=30;
    if(maxM<minM){const t=minM;minM=maxM;maxM=t;}
    const delay=(minM+Math.random()*(maxM-minM))*60000;
    scheduler.add(()=>{sendPartnerAutoMessage();scheduleAutoMessage();},delay,'autoMsg');
}
function sendPartnerAutoMessage(){
    const s=data.replySettings;
    let minC=Number(s.autoMsgMinCount),maxC=Number(s.autoMsgMaxCount);
    if(isNaN(minC)||minC<1) minC=1;
    if(isNaN(maxC)||maxC<1) maxC=3;
    if(maxC<minC){const t=minC;minC=maxC;maxC=t;}
    minC=Math.round(minC);maxC=Math.round(maxC);
    const count=clamp(randInt(minC,maxC),1,20);
    const cards=getAllCards();
    const emojiProb=Number(s.emojiReplyProbability)||0;
    const hasEmoji=Array.isArray(data.emojis)&&data.emojis.length>0;
    const teList=Array.isArray(data.textEmojis)?data.textEmojis:[];
    const teOn=!!s.textEmojiEnabled&&teList.length>0;
    let teProb=Number(s.textEmojiProbability);if(isNaN(teProb))teProb=0.2;
    const willTextEmoji=teOn&&Math.random()<teProb;
    const teWithCard=s.textEmojiWithCard!==false;
    const teText=willTextEmoji?pickTextEmoji():'';
    if(willTextEmoji&&!teWithCard){
        showTypingIndicator();scrollToBottomIfNear(150);
        scheduler.add(()=>{hideTypingIndicator();addMessage('partner',teText,'text',null,false,true);afterPartnerReply();},800+Math.random()*600,'autoMsgTextEmoji');
        return;
    }
    const msgs=[];
    for(let i=0;i<count;i++){
        if(cards.length>0&&Math.random()<0.7) msgs.push({type:'text',content:cards[Math.floor(Math.random()*cards.length)]});
        else{const fb=['在吗？','在干嘛呢','想你了','吃饭了吗？','今天过得怎么样？','嘿嘿','有空吗～'];msgs.push({type:'text',content:fb[Math.floor(Math.random()*fb.length)]});}
    }
    if(willTextEmoji&&teText) msgs.push({type:'text',content:teText});
    if(hasEmoji&&Math.random()<emojiProb){const emoji=data.emojis[Math.floor(Math.random()*data.emojis.length)];msgs.push({type:'emoji',content:emoji.dataUrl});}
    showTypingIndicator();scrollToBottomIfNear(150);
    const step=Math.max(350,Math.min(800,Math.round(2800/Math.max(1,msgs.length))));
    msgs.forEach((m,index)=>{
        scheduler.add(()=>{
            if(index===0) hideTypingIndicator();
            addMessage('partner',m.content,m.type,null,false,true);
            if(index===msgs.length-1) afterPartnerReply();
        },800+index*step,'autoMsgSend_'+index);
    });
}
function triggerPartnerMessage(){
    const cards=getAllCards();let text;
    if(cards.length>0) text=cards[Math.floor(Math.random()*cards.length)];
    else{const fb=['在吗？','在干嘛呢','想你了','吃饭了吗？','今天过得怎么样？'];text=fb[Math.floor(Math.random()*fb.length)];}
    showTypingIndicator();
    scheduler.add(()=>{hideTypingIndicator();addMessage('partner',text,'text',null,false,true);showToast('对方发来一条消息');},700,'manualMsg');
    closePlusPanel();
}
function triggerPartnerPat(){const contents=data.patSettings.contents||['拍了拍你'];if(!contents.length){showToast('请先添加拍一拍内容');return;}const content=contents[Math.floor(Math.random()*contents.length)];const name=data.partner.name||'对方';addPatMessage('partner',name+' '+content);closePlusPanel();}
function triggerPartnerEmoji(){if(!data.emojis||data.emojis.length===0){showToast('请先在工具里导入表情');return;}const emoji=data.emojis[Math.floor(Math.random()*data.emojis.length)];addMessage('partner',emoji.dataUrl,'emoji',null,false,true);closePlusPanel();}

function startRandomStatus(){
    if(statusTimeout) clearTimeout(statusTimeout);
    if(!data.replySettings.randomStatus) return;
    const pool=data.customStatuses||['在线'];if(pool.length===0) return;
    const tick=()=>{if(!data.replySettings.randomStatus)return;data.partner.status=pool[Math.floor(Math.random()*pool.length)];saveData();renderHeader();if(plusPanelOpen&&currentPlusTab==='settings'&&settingsPage==='info')renderSettingsPage();};

    const next=()=>{statusTimeout=setTimeout(()=>{tick();if(data.replySettings.randomStatus)next();},minInterval+Math.random()*(maxInterval-minInterval));};
    next();
}

/* ===================== 🔍 查岗 ===================== */
const CLOCK_PLACE_GROUP='位置';
const CLOCK_ACTION_GROUP='干什么';
let clockState={
    open:false,
    direction:null,
    targetName:'',
    stage:'home',
    cardDir:null,
    firstCard:null,
    verifyCards:[],
    verifyStage:null,
    autoPickIdx:-1,
    retryCount:0,
    connectionResult:null,
    timers:[]
};
function clearClockTimers(){
    (clockState.timers||[]).forEach(t=>{try{clearTimeout(t);}catch(e){}});
    clockState.timers=[];
}
function addClockTimer(t){clockState.timers.push(t);return t;}

function ensureClockCards(){
    if(!data.clockCards||typeof data.clockCards!=='object') data.clockCards={place:[],action:[]};
    if(!Array.isArray(data.clockCards.place)) data.clockCards.place=[];
    if(!Array.isArray(data.clockCards.action)) data.clockCards.action=[];
    return data.clockCards;
}
function migrateClockCards(){
    ensureClockCards();
    if(!data.wordCards||!Array.isArray(data.wordCards.groups)) return false;
    let changed=false;
    const map=[{name:CLOCK_PLACE_GROUP,target:data.clockCards.place},{name:CLOCK_ACTION_GROUP,target:data.clockCards.action}];
    map.forEach(({name,target})=>{
        const g=data.wordCards.groups.find(x=>x&&x.name===name);
        if(!g) return;
        const existing=new Set(target.map(c=>String(c.word)));
        (g.cards||[]).forEach(c=>{
            const w=c&&c.word?String(c.word).trim():'';
            if(w&&!existing.has(w)){target.push({id:genId(),word:w});existing.add(w);}
        });
        data.wordCards.groups=data.wordCards.groups.filter(x=>x!==g);
        changed=true;
    });
    return changed;
}
function getClockCards(direction){
    ensureClockCards();
    const arr=direction==='place'?data.clockCards.place:data.clockCards.action;
    return arr.filter(c=>c&&c.word).map(c=>({word:c.word,id:c.id}));
}
function shuffleArray(arr){
    for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
}
function openClock(){
    closePlusMenu();
    if(plusPanelOpen) closePlusPanel();
    if(letterPanelOpen) closeLetter();
    if(musicPanelOpen) closeMusic();
    if(divinationOpen) closeDivination();
    ensureClockCards();
    saveData();
    const panel=document.getElementById('clockPanel');
    if(!panel) return;
    clearClockTimers();
    clockState={
        open:true,
        direction:null,
        targetName:data.partner.name||'',
        stage:'home',
        cardDir:null,
        firstCard:null,
        verifyCards:[],
        verifyStage:null,
        autoPickIdx:-1,
        retryCount:0,
        connectionResult:null,
        timers:[]
    };
    panel.classList.add('open');
    renderClockPage();
}
function closeClock(){
    clearClockTimers();
    const panel=document.getElementById('clockPanel');
    if(panel) panel.classList.remove('open');
    clockState.open=false;
}
function renderClockPage(){
    const body=document.getElementById('clockBody');
    if(!body) return;
    if(clockState.stage==='home') renderClockHome(body);
    else if(clockState.stage==='connecting') renderClockConnecting(body);
    else if(clockState.stage==='drawing') renderClockDrawing(body);
    else if(clockState.stage==='cards') renderClockCardsManage(body);
    else if(clockState.stage==='verify'){
        if(clockState.verifyStage==='pick') renderClockVerifyPick(body);
        else renderClockShuffle(body,'正在洗牌……');
    }
}
function renderClockHome(body){
    body.innerHTML=''+
        '<div class="clock-title">请点击你想查询对方的方向？</div>'+
        '<div class="clock-big-row">'+
            '<div class="clock-big-btn" onclick="clockChooseDirection(\'place\')"><div class="clock-big-icon">📍</div><div class="clock-big-text">在哪里</div></div>'+

function startClockConnection(){
    clockState.stage='connecting';
    clockState.connectionResult=null;
    renderClockPage();
    const t=setTimeout(()=>{
        const rand=Math.random();
        let result;
        if(rand<0.35) result='success';
        else if(rand<0.55) result='unstable';
        else if(rand<0.78) result='busy';
        else result='refused';
        clockState.connectionResult=result;
        renderClockPage();
    },2000);
    addClockTimer(t);
}
function renderClockConnecting(body){
    if(!clockState.connectionResult){
        body.innerHTML=''+
            '<div class="clock-connecting">'+
                '<div class="clock-spinner"></div>'+
                '<div class="clock-connecting-text">正在连接对方中……</div>'+
                '<div class="clock-connecting-sub">目标：'+esc(clockState.targetName)+'</div>'+
            '</div>';
        return;
    }
    const r=clockState.connectionResult;
    const map={
        success:{icon:'✅',text:'连接成功',cls:'success'},
        unstable:{icon:'📶',text:'链接不稳',cls:'unstable'},
        busy:{icon:'⏳',text:'对方正在忙',cls:'busy'},
        refused:{icon:'🚫',text:'对方拒绝连接',cls:'refused'}
    };
    const info=map[r];
    const canNext=(r==='success'||r==='unstable');
    body.innerHTML=''+
        '<div class="clock-result-box '+info.cls+'">'+
            '<div class="clock-result-icon">'+info.icon+'</div>'+
            '<div class="clock-result-text">'+info.text+'</div>'+
            (canNext
                ? '<button class="btn-primary" style="margin-top:26px;padding:12px 40px;" onclick="clockStartDraw()">开始查询</button>'

        '</div>';
}
function clockBackHome(){
    clearClockTimers();
    clockState.stage='home';
    clockState.direction=null;
    clockState.connectionResult=null;
    clockState.firstCard=null;
    clockState.verifyCards=[];
    clockState.verifyStage=null;
    clockState.autoPickIdx=-1;
    clockState.retryCount=0;
    clockState.cardDir=null;
    renderClockPage();
}
function clockStartDraw(){
    const cards=getClockCards(clockState.direction);
    if(cards.length===0){
        showToast('该方向还没有查岗字卡');
        openClockCardSetting(clockState.direction);
        return;
    }
    clockState.stage='drawing';
    clockState.firstCard=null;
    clockState.verifyCards=[];
    clockState.verifyStage=null;
    clockState.autoPickIdx=-1;
    renderClockPage();
    const t=setTimeout(()=>{
        const pick=cards[Math.floor(Math.random()*cards.length)];

    if(btn) btn.style.display='none';
    const area=document.querySelector('.clock-draw-area');
    if(area&&!document.getElementById('clockBackBtn')){

        backBtn.id='clockBackBtn';
        backBtn.textContent='← 返回';
        backBtn.style.cssText='margin-top:18px;padding:10px 30px;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.7);font-size:14px;cursor:pointer;display:block;margin-left:auto;margin-right:auto;';
        backBtn.onclick=clockBackHome;
        area.appendChild(backBtn);
    }
    const t=setTimeout(()=>{showClockVerifyPrompt();},1000);

}
function showClockVerifyPrompt(){
    const firstWord=clockState.firstCard?clockState.firstCard.word:'';
    showModal('🔍 二次验证',
        '<div class="clock-first-ref" style="margin-bottom:14px;">你这次抽到的牌：<b>'+esc(firstWord)+'</b></div>'+
        '<div style="text-align:center;padding:6px 0 8px;font-size:16px;font-weight:600;">是否进行二次验证？</div>'+
        '<div class="setting-sub" style="text-align:center;margin-bottom:6px;">二次验证由系统自动帮你抽牌，确保这个字卡是否是我们所需的</div>'+
        '<div class="modal-actions">'+
            '<button class="btn-cancel" onclick="closeModal()">取消</button>'+
            '<button class="btn-confirm" onclick="clockStartVerify()">确认</button>'+
        '</div>'
    );
}
function clockStartVerify(){
    closeModal();
    const cards=getClockCards(clockState.direction);
    if(cards.length<3){
        showModal('提示','<div style="text-align:center;padding:12px 0 16px;">该方向的查岗字卡不足 3 张，无法进行二次验证</div><div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">知道了</button></div>');
        return;
    }
    if(!clockState.firstCard){
        showToast('数据异常，请重新查询');
        clockBackHome();
        return;
    }
    const others=cards.filter(c=>c.id!==clockState.firstCard.id);
    shuffleArray(others);
    const two=others.slice(0,2);
    const three=[clockState.firstCard,...two];
    shuffleArray(three);
    clockState.verifyCards=three;
    clockState.verifyStage=null;
    clockState.autoPickIdx=-1;
    clockState.stage='verify';
    renderClockPage();
    const t=setTimeout(()=>{
        clockState.verifyStage='pick';
        renderClockPage();
        const t2=setTimeout(()=>{
            if(!clockState.open||clockState.stage!=='verify'||!clockState.verifyCards.length) return;
            const idx=Math.floor(Math.random()*clockState.verifyCards.length);
            clockAutoPickVerifyCard(idx);
        },1500);
        addClockTimer(t2);
    },1600);
    addClockTimer(t);
}
function renderClockVerifyPick(body){
    const firstWord=clockState.firstCard?clockState.firstCard.word:'';
    let html='<div class="clock-verify-title">系统正在自动验证…</div>';
    if(firstWord) html+='<div class="clock-verify-first-wrap"><div class="clock-verify-first">你之前抽到的牌：<b>'+esc(firstWord)+'</b></div></div>';
    html+='<div class="clock-verify-cards">';
    clockState.verifyCards.forEach((c,i)=>{
        const picked=clockState.autoPickIdx===i;
        html+='<div class="clock-verify-card'+(picked?' picked':'')+'" data-vid="'+i+'">'+(picked?esc(c.word):'⭐')+'</div>';
    });
    html+='</div>';
    html+='<div class="clock-auto-tip">'+(clockState.autoPickIdx>=0?'正在比对验证结果……':'无需手动选择，系统会自动从这 3 张牌中抽出 1 张进行验证')+'</div>';
    body.innerHTML=html;
}
function clockAutoPickVerifyCard(idx){
    const picked=clockState.verifyCards[idx];
    if(!picked||!clockState.firstCard) return;
    clockState.autoPickIdx=idx;
    renderClockPage();
    const isMatch=picked.id===clockState.firstCard.id;
    const firstWord=clockState.firstCard.word;
    const t=setTimeout(()=>{
        if(isMatch){
            showModal('✅ 验证成功',
                '<div class="clock-first-ref">你之前抽到的牌：<b>'+esc(firstWord)+'</b></div>'+
                '<div class="clock-picked-card">'+esc(picked.word)+'</div>'+
                '<div class="clock-picked-hint" style="color:#10b981;">系统自动验证结果与首次一致，可信度较高</div>'+
                '<div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">完成</button></div>'
            );
        }else{
            clockState.retryCount++;
            const isFinal=clockState.retryCount>=2;
            if(isFinal){
                showModal('😔 验证失败',
                    '<div class="clock-first-ref">你之前抽到的牌：<b>'+esc(firstWord)+'</b></div>'+
                    '<div class="clock-picked-card">'+esc(picked.word)+'</div>'+
                    '<div class="clock-picked-hint" style="color:#ef4444;font-weight:600;">系统自动验证两次均不一致，对方可能在忙，请稍后重试</div>'+
                    '<div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">知道了</button></div>'
                );
            }else{
                showModal('🤔 验证不一致',
                    '<div class="clock-first-ref">你之前抽到的牌：<b>'+esc(firstWord)+'</b></div>'+
                    '<div class="clock-picked-card">'+esc(picked.word)+'</div>'+
                    '<div class="clock-picked-hint">系统自动验证结果与首次不一致，是否重新验证一次？</div>'+
                    '<div class="modal-actions">'+
                        '<button class="btn-cancel" onclick="closeModal();clockBackHome();">取消</button>'+
                        '<button class="btn-confirm" onclick="clockRetry()">重新验证</button>'+
                    '</div>'
                );
            }
        }
    },700);
    addClockTimer(t);
}
function clockRetry(){
    closeModal();
    const cards=getClockCards(clockState.direction);
    if(cards.length===0){showToast('该方向还没有查岗字卡');clockBackHome();return;}
    clockStartDraw();
}

function clockAddCard(){
    const inp=document.getElementById('clockNewCardInput');
    if(!inp) return;
    const val=inp.value.trim();
    if(!val){showToast('请输入内容');return;}
    ensureClockCards();
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const words=val.split(/[,，\n]+/).map(s=>s.trim()).filter(Boolean);
    const existing=new Set(list.map(c=>c.word));
    let added=0,skipped=0;
    words.forEach(w=>{
        if(existing.has(w)){skipped++;return;}
        list.push({id:genId(),word:w});existing.add(w);added++;
    });
    saveData();
    renderClockCardsManage(document.getElementById('clockBody'));
    if(added) showToast('已添加 '+added+' 张'+(skipped?'，跳过 '+skipped+' 张重复':''));
    else showToast('内容已存在');
}
function openClockBatchAdd(){
    const dir=clockState.cardDir||'place';

function clockConfirmBatchAdd(){
    const ta=document.getElementById('clockBatchInput');
    if(!ta) return;
    const raw=ta.value;
    const lines=raw.split(/[\n,，;；]+/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length){showToast('请输入内容');return;}
    ensureClockCards();
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const existing=new Set(list.map(c=>String(c.word)));
    let added=0,skipped=0;
    lines.forEach(w=>{
        if(existing.has(w)){skipped++;return;}
        list.push({id:genId(),word:w});existing.add(w);added++;
    });
    saveData();closeModal();
    renderClockCardsManage(document.getElementById('clockBody'));
    if(added) showToast('✅ 新增 '+added+' 张'+(skipped?'，跳过 '+skipped+' 张重复':''));

}
function clockDeleteCard(id){
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const idx=list.findIndex(c=>c.id===id);
    if(idx<0) return;
    if(!confirm('删除这张查岗字卡？')) return;
    list.splice(idx,1);saveData();
    renderClockCardsManage(document.getElementById('clockBody'));
    showToast('已删除');
}
function clockEditCard(id){
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const card=list.find(c=>c.id===id);
    if(!card) return;
    const nv=prompt('编辑查岗字卡：',card.word);
    if(nv===null) return;
    const w=nv.trim();
    if(!w){showToast('内容不能为空');return;}
    if(list.some(c=>c.word===w&&c.id!==id)){showToast('⚠️ 该字卡已存在');return;}
    card.word=w;saveData();
    renderClockCardsManage(document.getElementById('clockBody'));
    showToast('已更新');
}

function confirmDecision(){
    const question=document.getElementById('decisionQuestion').value.trim();
    const optionsStr=document.getElementById('decisionOptions').value;
    let delay=parseInt(document.getElementById('decisionDelay').value,10);
    if(!question){showToast('请输入问题');return;}
    if(!optionsStr||!optionsStr.trim()){showToast('请输入选项');return;}
    if(isNaN(delay)) delay=3;delay=clamp(delay,1,10);
    const options=optionsStr.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(options.length<2){showToast('请至少输入两个选项（每行一个）');return;}
    const chosen=options[Math.floor(Math.random()*options.length)];
    const reply='关于「'+question+'」，我的答案是：'+chosen;
    closeModal();showTypingIndicator();scrollToBottomIfNear(150);
    showToast('对方正在思考…（'+delay+' 秒后回复）');
    scheduler.add(()=>{hideTypingIndicator();addMessage('partner',reply,'text',null);showToast('结果：'+chosen);},delay*1000,'decision');
}
const CALL_RING_TIMEOUT=30;
function renderCallBox(){
    const c=document.getElementById('modalContainer');if(!c) return;
    const name=data.partner.name||'对方';const avatar=data.partner.avatar||'';
    const avatarHtml=avatar?'<img src="'+esc(avatar)+'" alt="avatar">':'<div class="placeholder">'+esc((name||'?')[0].toUpperCase())+'</div>';
    const st=callState;
    let statusText='',countdownText='',timerText=fmtDuration(st.seconds);
    if(st.answered) statusText='通话中';
    else if(st.isOutgoing) statusText='📞 呼叫中...';
    else{statusText='📞 来电...';countdownText='响铃中 · '+st.ringLeft+' 秒后未接自动挂断';}
    c.innerHTML='<div class="call-modal" id="callModal"><div class="call-box"><button class="call-minimize" onclick="minimizeCall()">⏺</button><div class="call-avatar">'+avatarHtml+'</div><div class="call-name">'+esc(name)+'</div><div class="call-status" id="callStatus">'+statusText+'</div><div class="call-countdown" id="callCountdown">'+countdownText+'</div><div class="call-timer" id="callTimer">'+timerText+'</div><div class="call-actions"><button class="btn-end" onclick="endCall(\'\')">📞</button>'+((!st.isOutgoing&&!st.answered)?'<button class="btn-answer" onclick="answerCall()">📞</button>':'')+'</div></div></div>';
}
function resetCallMiniPosition(){const mini=document.getElementById('callMini');if(!mini) return;mini.style.left='';mini.style.top='';mini.style.right='16px';mini.style.bottom='130px';}
function showCallModal(isOutgoing){
    if(callState&&callState.active){restoreCall();return;}
    callState={active:true,minimized:false,isOutgoing:!!isOutgoing,answered:false,seconds:0,ringLeft:CALL_RING_TIMEOUT,ringId:null,timerId:null,timeoutId:null,countdownId:null};
    resetCallMiniPosition();renderCallBox();
    const mini=document.getElementById('callMini');if(mini)mini.style.display='none';
    if(!isOutgoing){
        startRingTone();showSystemNotification({content:'📞 '+(data.partner.name||'对方')+' 给你打电话',type:'call'});
        try{if(navigator.vibrate)navigator.vibrate([300,150,300,150,300]);}catch(e){}
        callState.countdownId=setInterval(()=>{
            if(!callState||!callState.active) return;
            if(callState.answered) return;
            callState.ringLeft--;
            const el=document.getElementById('callCountdown');if(el)el.textContent='响铃中 · '+callState.ringLeft+' 秒后未接自动挂断';
            if(callState.ringLeft<=0) endCall('missed');
        },1000);
    }else{
        const willAnswer=Math.random()>0.25;
        if(willAnswer) setTimeout(()=>{if(callState&&callState.active&&!callState.answered)answerCall();},2000+Math.random()*3000);
        else setTimeout(()=>{if(callState&&callState.active&&!callState.answered)endCall('rejected');},1500+Math.random()*2500);
        callState.timeoutId=setTimeout(()=>{if(callState&&callState.active&&!callState.answered)endCall('missed');},CALL_RING_TIMEOUT*1000);
    }
}
function answerCall(){
    if(!callState||callState.answered) return;
    callState.answered=true;stopRingTone();
    if(callState.ringId)clearInterval(callState.ringId);
    if(callState.timeoutId)clearTimeout(callState.timeoutId);
    if(callState.countdownId)clearInterval(callState.countdownId);
    const st=document.getElementById('callStatus');if(st)st.textContent='通话中';
    const cd=document.getElementById('callCountdown');if(cd)cd.textContent='';
    callState.seconds=0;
    callState.timerId=setInterval(()=>{
        if(!callState) return;
        callState.seconds++;
        const d=fmtDuration(callState.seconds);
        const t=document.getElementById('callTimer');if(t)t.textContent=d;
        const mt=document.getElementById('miniTimer');if(mt)mt.textContent=d;
    },1000);
    showToast('📞 已接通');
}
function endCall(reason){
    if(!callState) return;
    if(typeof reason!=='string') reason='';
    stopRingTone();
    if(callState.ringId)clearInterval(callState.ringId);
    if(callState.timerId)clearInterval(callState.timerId);
    if(callState.timeoutId)clearTimeout(callState.timeoutId);
    if(callState.countdownId)clearInterval(callState.countdownId);
    const dur=callState.seconds,isOut=callState.isOutgoing,answered=callState.answered;
    let content='',shouldRecord=true;
    if(isOut){
        if(reason==='rejected') content='对方拒绝了来电';
        else if(reason==='missed') content='对方未接听';
        else if(answered) content='我打给ta（通话 '+fmtDuration(dur)+'）';
        else shouldRecord=false;
    }else{
        if(reason==='missed'||!answered) content='你未接听';
        else content='ta打给我（通话 '+fmtDuration(dur)+'）';
    }
    if(shouldRecord&&content) addMessage(isOut?'me':'partner',content,'call',null,isOut?true:false);
    const toastMsg=reason==='rejected'?'📞 对方拒接':reason==='missed'?'📞 未接听':answered?'📞 通话结束':'';
    callState.active=false;callState=null;
    const c=document.getElementById('modalContainer');if(c)c.innerHTML='';
    const mini=document.getElementById('callMini');if(mini)mini.style.display='none';
    if(toastMsg) showToast(toastMsg);
}
function minimizeCall(){
    if(!callState) return;
    callState.minimized=true;
    const c=document.getElementById('modalContainer');if(c)c.innerHTML='';
    const mini=document.getElementById('callMini');if(mini)mini.style.display='flex';
    const mt=document.getElementById('miniTimer');if(mt)mt.textContent=fmtDuration(callState.seconds);
}
function restoreCall(){
    if(!callState) return;
    callState.minimized=false;renderCallBox();
    const mini=document.getElementById('callMini');if(mini)mini.style.display='none';
}
function initCallMiniDrag(){
    const mini=document.getElementById('callMini');if(!mini) return;
    let drag=null;
    const getPoint=e=>{if(e.touches&&e.touches[0])return e.touches[0];if(e.changedTouches&&e.changedTouches[0])return e.changedTouches[0];return e;};
    const onStart=e=>{const pt=getPoint(e),rect=mini.getBoundingClientRect();drag={offsetX:pt.clientX-rect.left,offsetY:pt.clientY-rect.top,startX:pt.clientX,startY:pt.clientY,moved:false};mini.classList.add('dragging');if(e.cancelable)e.preventDefault();};
    const onMove=e=>{if(!drag)return;const pt=getPoint(e);if(Math.abs(pt.clientX-drag.startX)>5||Math.abs(pt.clientY-drag.startY)>5)drag.moved=true;const x=pt.clientX-drag.offsetX,y=pt.clientY-drag.offsetY;const w=mini.offsetWidth,h=mini.offsetHeight;const maxX=Math.max(0,window.innerWidth-w),maxY=Math.max(0,window.innerHeight-h);mini.style.left=Math.max(0,Math.min(maxX,x))+'px';mini.style.top=Math.max(0,Math.min(maxY,y))+'px';mini.style.right='auto';mini.style.bottom='auto';if(e.cancelable)e.preventDefault();};
    const onEnd=()=>{if(!drag)return;const moved=drag.moved;drag=null;mini.classList.remove('dragging');if(!moved)restoreCall();};
    mini.addEventListener('touchstart',onStart,{passive:false});
    mini.addEventListener('touchmove',onMove,{passive:false});
    mini.addEventListener('touchend',onEnd);mini.addEventListener('touchcancel',onEnd);
    mini.addEventListener('mousedown',onStart);
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);
}

function importData(){
    const input=document.createElement('input');input.type='file';input.accept='application/json';
    input.onchange=function(e){
        const file=e.target.files[0];if(!file) return;
        const reader=new FileReader();
        reader.onload=function(ev){
            try{
                const imported=JSON.parse(ev.target.result);
                if(!imported||typeof imported!=='object'){showToast('⚠️ 无效的数据文件');return;}
                if(!confirm('导入将覆盖对应内容，确定继续吗？')) return;
                const def=defaultData();
                if(imported._type==='lingji_selective'){
                    const keys=Object.keys(imported).filter(k=>!k.startsWith('_'));
                    keys.forEach(k=>{
                        if(k==='theme'&&imported.theme) data.theme=Object.assign({},data.theme,imported.theme);
                        else if(k==='settings'&&imported.settings) data.settings=Object.assign({},data.settings,imported.settings);
                        else if(k==='replySettings'&&imported.replySettings) data.replySettings=Object.assign({},data.replySettings,imported.replySettings);
                        else if(k==='patSettings'&&imported.patSettings) data.patSettings=Object.assign({},data.patSettings,imported.patSettings);
                        else if(imported[k]!==undefined) data[k]=imported[k];
                    });
                }else data=deepMerge(def,imported);
                initDataFields();
                dedupeWordCards();ensureLetterDailyReset();
                saveNow();applyTheme();renderHeader();renderMessagesNow();
                if(plusPanelOpen) renderSettingsPage();
                if(musicPanelOpen) renderMusicPage();
                if(letterPanelOpen) renderLetterPage();
                updateLetterMenuDot();
                if(data.replySettings.randomStatus) startRandomStatus();
                scheduleAutoMessage();
                if(data.settings.keepAlive) startKeepAliveAudio(); else stopKeepAliveAudio();
                showToast('✅ 数据导入成功');
            }catch(err){showToast('⚠️ 数据解析失败');}
        };
        reader.readAsText(file);
    };
    input.click();
}
function clearAllData(){
    if(!confirm('⚠️ 确定要清除所有数据吗？此操作不可恢复！')) return;
    if(!confirm('再次确认：清除所有聊天记录、字卡、查岗字卡、表情、信件、设置？')) return;

}

function replyToMessage(id){
    const m=(data.messages||[]).find(x=>x.id===id);if(!m) return;
    currentReplyTarget=id;
    let text=m.content||'';
    if(m.type==='emoji'||m.type==='image') text='[图片]';
    if(m.type==='recall') text='[已撤回]';
    if(text.length>30) text=text.slice(0,30)+'…';
    const who=m.sender==='me'?'我':(data.partner.name||'对方');
    const preview=document.getElementById('replyPreview'),txt=document.getElementById('replyPreviewText');
    if(txt)txt.textContent='回复 '+who+'：'+text;
    if(preview)preview.style.display='flex';
    const input=document.getElementById('msgInput');if(input)input.focus();
     closeAllMsgActions();
}
function cancelReply(){currentReplyTarget=null;const preview=document.getElementById('replyPreview');if(preview)preview.style.display='none';}
function deleteMessage(id){
    if(!confirm('确定删除这条消息吗？')) return;
    data.messages=(data.messages||[]).filter(m=>m.id!==id);
    saveData();renderMessagesNow();showToast('已删除');
}
function onBubbleClick(id){
    const group=document.querySelector('.msg-group[data-id="'+id+'"]');if(!group) return;
    const actions=group.querySelector('.msg-actions');if(!actions) return;
    const wasOpen=actions.classList.contains('show');
    closeAllMsgActions();
    if(wasOpen) return;            // 再点一次 => 收起
    actions.classList.add('show');
    // 若气泡太靠近顶部，操作条改到气泡下方，避免被裁掉
    const area=document.getElementById('message-area');
    const bubble=group.querySelector('.msg-bubble');
    if(area&&bubble){
        const ar=area.getBoundingClientRect();
        const br=bubble.getBoundingClientRect();
        if(br.top-ar.top<46) actions.classList.add('below');
    }
}
function closeAllMsgActions(){
    document.querySelectorAll('.msg-actions.show').forEach(function(a){
        a.classList.remove('show');
        a.classList.remove('below');
    });
}

function sendCustomPat(){
    const ta=document.getElementById('patCustomInput');
    const text=ta?ta.value.trim():'';
    if(!text){showToast('请输入内容');return;}
    const name=data.user.name||'我';
    addPatMessage('me',name+' '+text);closePatInput();schedulePartnerReply();
}

/* ===================== 点左上角头像继续说 ===================== */
function pokePartnerContinue(){
    scheduler.cancelByKey('pokeContinue');
    scheduler.cancelByKey('pokeContinueMsg_0');
    scheduler.cancelByKey('pokeContinueMsg_1');
    scheduler.add(()=>{
        const count=Math.random()<0.5?1:2;
        const cards=getAllCards();
        showTypingIndicator();scrollToBottomIfNear(150);
        for(let i=0;i<count;i++){
            scheduler.add(()=>{
                if(i===0) hideTypingIndicator();
                let text;
                if(cards.length) text=cards[Math.floor(Math.random()*cards.length)];
                else{const fb=['嗯嗯','在的','怎么啦','继续说','我在听'];text=fb[Math.floor(Math.random()*fb.length)];}
                addMessage('partner',text,'text',null,true,false);
                if(i===count-1) afterPartnerReply();
            },400+i*700,'pokeContinueMsg_'+i);
        }
    },3000,'pokeContinue');
}

/* ===================== 初始化 ===================== */
async function init(){
    try{loadData();}catch(e){console.error('数据初始化失败',e);data=defaultData();}
    if(!_hadLocalData){
        try{
            const idbRaw=await idbGet('data');
            if(idbRaw){
                try{
                    const parsed=JSON.parse(idbRaw);
                    if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed)){
                        const hasData=(parsed.messages&&parsed.messages.length)||
                                      (parsed.emojis&&parsed.emojis.length)||
                                      (parsed.wordCards&&parsed.wordCards.groups&&parsed.wordCards.groups.length)||
                                      (parsed.clockCards&&((parsed.clockCards.place&&parsed.clockCards.place.length)||(parsed.clockCards.action&&parsed.clockCards.action.length)))||
                                      (parsed.music&&parsed.music.list&&parsed.music.list.length)||
                                      (parsed.letters&&parsed.letters.list&&parsed.letters.list.length)||
                                      (parsed.partner&&parsed.partner.name);
                        if(hasData){
                            data=deepMerge(defaultData(),parsed);
                            initDataFields();
                            _hadLocalData=true;
                            showToast('已从本地镜像备份恢复数据');
                        }
                    }
                }catch(e){}
            }
        }catch(e){}
    }
    try{
        if(Array.isArray(data.emojis)&&data.emojis.some(e=>e&&e.id&&!e.dataUrl)){
            const store=await idbGet('emojis');
            if(store&&Array.isArray(store)){
                const map={};
                store.forEach(e=>{if(e&&e.id&&e.dataUrl) map[e.id]=e.dataUrl;});
                let changed=false;
                data.emojis.forEach(e=>{if(e&&e.id&&!e.dataUrl&&map[e.id]){e.dataUrl=map[e.id];changed=true;}});
                if(changed) saveData();
            }
        }
    }catch(e){}
    try{
        if(data.music&&Array.isArray(data.music.list)&&data.music.list.some(s=>s&&s.source==='file'&&!s.url)){
            const store=await idbGet('music_urls');
            if(store&&Array.isArray(store)){
                const map={};
                store.forEach(s=>{if(s&&s.id&&s.url) map[s.id]=s.url;});
                let changed=false;
                data.music.list.forEach(s=>{if(s&&s.source==='file'&&!s.url&&map[s.id]){s.url=map[s.id];changed=true;}});
                if(changed) saveData();
            }
        }
    }catch(e){}

    try{dedupeWordCards();}catch(e){}
    try{ensureLetterDailyReset();}catch(e){}
    try{saveData();}catch(e){}
    try{applyTheme();}catch(e){}
    try{applyCustomCSS();}catch(e){}
    try{applyCustomFont();}catch(e){}
    try{renderHeader();}catch(e){}
    try{renderMessagesNow();}catch(e){}
    try{initCallMiniDrag();}catch(e){}
    try{updateMusicBottomBar();}catch(e){}
    try{updateLetterMenuDot();}catch(e){}
    try{setupBackGuard();}catch(e){}
    try{registerSW();}catch(e){}
    startTickWorker();
    if(data.replySettings&&data.replySettings.randomStatus) startRandomStatus();
    scheduleAutoMessage();
    if(data.settings.keepAlive){startKeepAliveAudio();startKeepAliveHealLoop();}
    setTimeout(()=>{const s=document.getElementById('splash');if(s)s.classList.add('hide');},2000);

    const input=document.getElementById('msgInput');
    if(input){
        input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';});
        input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
    }
    const sendBtn=document.getElementById('sendBtn');if(sendBtn)sendBtn.addEventListener('click',sendMessage);

    const headerAvatar=document.getElementById('headerAvatar');
    if(headerAvatar){
        let _lastPoke=0;
        const doPoke=function(e){
            if(e){e.stopPropagation();if(e.cancelable)e.preventDefault();}
            const now=Date.now();
            if(now-_lastPoke<600) return;
            _lastPoke=now;
            pokePartnerContinue();
        };
        headerAvatar.addEventListener('click',doPoke);
        headerAvatar.addEventListener('touchend',doPoke,{passive:false});
        headerAvatar.style.cursor='pointer';
    }

    window.addEventListener('beforeunload',()=>{try{flushSave();}catch(e){}});
    console.log('💜 悸动 v6.7 已启动（新增字卡批量删除）');
}

document.addEventListener('click',function(e){
    const el=e.target.closest('.toggle-switch[data-toggle]');
    if(!el) return;
    const action=el.getAttribute('data-toggle');
    if(action==='seenNoReply'){e.stopPropagation();toggleSeenNoReply(e);}
    else if(action==='recall'){e.stopPropagation();toggleRecall(e);}
    else if(action==='spell'){e.stopPropagation();toggleSpell(e);}
},true);
