<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFE4E9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="悸动">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>悸动</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--primary:#4A90D9;--primary-light:#6BA8E8;--bg:#f5f7fa;--chat-bg:#f5f7fa;--card-bg:#fff;--text:#1a1a2e;--text-light:#6b7280;--border:#e5e7eb;--shadow:0 2px 12px rgba(0,0,0,.08);--radius:16px;--radius-sm:10px;--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);--header-bg:#fff;--footer-bg:#fff;--bubble-me:#4A90D9;--bubble-me-text:#fff;--bubble-other:#e8ecf1;--bubble-other-text:#1a1a2e;--bubble-radius:16px;--msg-font-size:15px;--avatar-radius:50%;}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;user-select:none;-webkit-user-select:none;}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
#splash{position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#FFE4E9,#FFD5DE 55%,#FFE9EE);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .65s,visibility .65s;gap:0}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .splash-icon{width:min(42vw,160px);height:min(42vw,160px);border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 18px 50px rgba(255,140,165,.4);display:flex;align-items:center;justify-content:center;animation:splashFloat 3.2s ease-in-out infinite;margin-bottom:36px}
#splash .splash-icon img{width:100%;height:100%;object-fit:cover}
#splash .splash-bottom{text-align:center;font-size:15px;color:#B87487;line-height:1.7;font-family:"Times New Roman",Georgia,serif;letter-spacing:.5px;padding:0 16px;animation:fadeUp 1.2s ease .3s both;max-width:90vw}
@keyframes splashFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.02)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
#app{display:flex;flex-direction:column;height:100%;width:100%;max-width:480px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
#header{background:var(--header-bg);padding:calc(8px + var(--safe-top)) 12px 8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;min-height:60px;z-index:10}
#header .left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
#header .avatar-wrap{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--border);border:2px solid var(--primary-light);cursor:pointer;transition:transform .15s}
#header .avatar-wrap:active{transform:scale(.9)}
#header .avatar-wrap img{width:100%;height:100%;object-fit:cover}
#header .avatar-wrap .avatar-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#fff;background:var(--primary)}
#header .info .name{font-weight:600;font-size:17px;display:flex;align-items:center;gap:4px}
#header .info .name .edit-name{font-size:13px;color:var(--text-light);cursor:pointer;padding:0 4px;opacity:.6}
#header .info .status{font-size:12px;color:var(--text-light);display:flex;align-items:center;gap:4px}
#header .info .status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34d399}
#header .info .status .dot.offline{background:#9ca3af}
#header .right{display:flex;align-items:center;gap:2px}
#header .right button{background:none;border:none;font-size:20px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--text-light);transition:.2s}
#header .right button:active{background:var(--border);transform:scale(.94)}
#header .right .plus-btn{font-size:34px;font-weight:300;line-height:1;color:var(--primary);padding:2px 10px 4px}

/* ====== 修复：菜单防透出与硬件加速 ====== */
#plusMenu{position:fixed;top:calc(60px + var(--safe-top));right:12px;z-index:6000;padding:6px;min-width:150px;transform:scale(.85) translateZ(0);transform-origin:top right;opacity:0;visibility:hidden;transition:transform .15s ease-out,opacity .15s ease-out,visibility .15s;will-change:transform,opacity;background:transparent !important;box-shadow:none !important;}
#plusMenu::before{content:'';position:absolute;inset:0;background:var(--card-bg);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:-1;pointer-events:none;}
#plusMenu.open{transform:scale(1) translateZ(0);opacity:1;visibility:visible}
#plusMenu .menu-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:500;color:var(--text);transition:.15s;user-select:none;position:relative;z-index:1;}
#plusMenu .menu-item:active{background:var(--bg)}
#plusMenu .menu-item .mi-icon{font-size:20px}
.menu-reddot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:#ef4444;border:2px solid #fff;display:none}
.menu-reddot.show{display:block}
#pageChat{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#message-area{flex:1;overflow-y:auto;padding:12px 10px 8px;display:flex;flex-direction:column;gap:10px;background-color:var(--chat-bg);background-size:cover;background-position:center;background-repeat:no-repeat;-webkit-overflow-scrolling:touch;min-height:0;position:relative}
#message-area.no-anim .msg-group,#message-area.no-anim .msg-system-center,#message-area.no-anim .msg-time-divider{animation:none !important}
.msg-group{display:flex;gap:8px;max-width:84%;align-items:flex-start;animation:msgIn .22s ease;will-change:transform,opacity;}
.msg-group.me{align-self:flex-end;flex-direction:row-reverse}
.msg-group.other{align-self:flex-start}
.msg-avatar{width:38px;height:38px;border-radius:var(--avatar-radius);overflow:hidden;flex-shrink:0;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg-side{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;min-width:38px}
.msg-side-time{font-size:10px;color:var(--text-light);opacity:.8;white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums}
.msg-body{display:flex;flex-direction:column;min-width:0;max-width:100%}
.msg-group.me .msg-body{align-items:flex-end}
.msg-bubble{padding:10px 14px;border-radius:var(--bubble-radius);word-break:break-word;line-height:1.5;font-size:var(--msg-font-size);position:relative;max-width:100%;box-shadow:0 1px 2px rgba(0,0,0,.04);background-clip:padding-box;}
.msg-group.me .msg-bubble{background:var(--bubble-me);color:var(--bubble-me-text);border-bottom-right-radius:4px}
.msg-group.other .msg-bubble{background:var(--bubble-other);color:var(--bubble-other-text);border-bottom-left-radius:4px}
.msg-bubble .time{display:none}
.msg-group.other .msg-bubble .time{display:none}
.msg-bubble .reply-ref{font-size:12px;opacity:.75;padding:4px 8px;background:rgba(0,0,0,.06);border-radius:6px;margin-bottom:6px;display:block;border-left:3px solid var(--primary-light);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
/* 操作条：悬浮在气泡上方，点击气泡才出现 */
.msg-bubble .msg-actions{display:none;position:absolute;bottom:calc(100% + 8px);right:0;gap:4px;align-items:center;padding:4px 6px;background:rgba(255,255,255,.98);border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.15);z-index:30;white-space:nowrap;}
.msg-group.other .msg-bubble .msg-actions{left:0;right:auto;}
.msg-bubble .msg-actions.show{display:flex;}
.msg-bubble .msg-actions.below{top:calc(100% + 8px);bottom:auto;}
.msg-bubble .msg-actions button{background:none;border:none;font-size:12px;line-height:1.4;color:var(--text-light);cursor:pointer;padding:4px 8px;border-radius:6px;font-family:inherit;}
.msg-bubble .msg-actions button:active{background:var(--bg);color:var(--text);}
.msg-bubble.recall-bubble{cursor:pointer;user-select:none;}
.msg-time-divider{text-align:center;font-size:11px;color:var(--text-light);padding:6px 0 2px;opacity:.7}
.msg-time-divider span{background:rgba(0,0,0,.06);padding:2px 10px;border-radius:10px}
.msg-system-center{text-align:center;padding:2px 0;width:100%;align-self:center;animation:msgIn .22s ease}
.msg-system-center span{display:inline-block;font-size:12px;color:var(--text-light);background:rgba(0,0,0,.05);padding:5px 14px;border-radius:12px;max-width:82%;word-break:break-word;line-height:1.5}
.msg-system-center span b{font-weight:600;color:var(--text)}
.msg-system-center .sys-icon{font-size:13px;margin-right:3px}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.auto-badge{position:absolute;top:-6px;left:-8px;font-size:14px;line-height:1;z-index:5;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));animation:autoBadgePop .4s ease}
@keyframes autoBadgePop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.msg-group.me .auto-badge{left:auto;right:-8px}

/* ====== 修复：让表情包完美跟随自定义气泡 ====== */
.msg-bubble.emoji-bubble{
    background: inherit; 
    border: inherit;
    color: transparent;
    padding: 6px; 
    line-height: 0;
    max-width: 200px;
    position: relative;
    box-shadow: inherit;
    border-radius: inherit;
}
.msg-group.me .msg-bubble.emoji-bubble{
    background: inherit;
    border: inherit;
    box-shadow: inherit;
}
.msg-bubble.emoji-bubble .emoji-img{
    max-width: 110px;
    max-height: 120px;
    border-radius: calc(var(--bubble-radius) - 6px); 
    display: block;
    background: #fff; 
}
.msg-bubble.emoji-bubble .emoji-img.img-large{
    max-width: 180px;
    max-height: 200px;
}
.msg-bubble.emoji-bubble .time{display:none}

.msg-bubble.emoji-bubble .msg-actions{
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: rgba(255,255,255,.98);
    border-radius: 10px;
    padding: 4px 6px;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
    z-index: 30;
    display: none;
    white-space: nowrap;
    align-items: center;
    gap: 4px;
}
.msg-group.other .msg-bubble.emoji-bubble .msg-actions{left:0;right:auto;}
.msg-bubble.emoji-bubble .msg-actions.show{display:flex}
.msg-bubble.emoji-bubble .msg-actions.below{top:calc(100% + 8px);bottom:auto;}
.msg-bubble.emoji-bubble .msg-actions button{background:none;border:none;font-size:12px;line-height:1.4;color:var(--text-light);cursor:pointer;padding:4px 8px;border-radius:6px;font-family:inherit;}
.msg-bubble.emoji-bubble.has-reply{
    padding: 10px 14px;
    line-height: 1.5;
    max-width: 100%;
}
.msg-bubble.emoji-bubble.has-reply .emoji-img{
    margin-top: 4px;
    box-shadow: none;
}
#footer{background:var(--footer-bg);padding:8px 12px calc(8px + var(--safe-bottom));display:flex;flex-direction:column;border-top:1px solid var(--border);flex-shrink:0;position:relative;z-index:10}
#footer .footer-main{display:flex;align-items:center;gap:8px;width:100%}
#footer .input-wrap{flex:1;min-width:0;display:flex;align-items:center;background:var(--bg);border-radius:22px;padding:4px 12px;border:1px solid var(--border);transition:.2s;min-height:40px}
#footer .input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(74,144,217,.12)}
#footer .input-wrap textarea{flex:1;border:none;background:transparent;resize:none;outline:none;font-size:15px;font-family:inherit;padding:6px 0;max-height:100px;line-height:1.4;color:var(--text);min-height:22px}
#footer .tool-btn{background:none;border:none;font-size:22px;padding:0;border-radius:50%;cursor:pointer;color:var(--text-light);transition:.2s;flex-shrink:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
#footer .tool-btn:active{transform:scale(.88);background:var(--border)}
#footer .more-btn{color:var(--primary)}
#footer .more-btn svg{width:25px;height:25px;display:block}
#footer .send-btn{background:var(--primary);color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:.2s;box-shadow:0 2px 8px rgba(74,144,217,.3);padding:0;margin-left:2px;}
#footer .send-btn:active{transform:scale(.92);opacity:.8}
#replyPreview{display:none;align-items:center;gap:6px;background:var(--bg);border-left:3px solid var(--primary);border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:12px;color:var(--text-light);width:100%}
#replyPreview .rp-icon{flex-shrink:0;font-size:13px;color:var(--primary)}
#replyPreview .rp-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#replyPreview .rp-close{background:none;border:none;font-size:14px;color:var(--text-light);cursor:pointer;padding:0 4px;flex-shrink:0;line-height:1}

/* ====== 修复：收纳菜单防透出与防卡顿 ====== */
#morePanel{position:absolute;bottom:calc(100% + 10px);left:12px;z-index:6000;padding:6px;min-width:152px;transform:scale(.85) translateZ(0);transform-origin:bottom left;opacity:0;visibility:hidden;transition:transform .15s ease-out,opacity .15s ease-out,visibility .15s;will-change:transform,opacity;background:transparent !important;box-shadow:none !important;}
#morePanel::before{content:'';position:absolute;inset:0;background:var(--card-bg);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:-1;pointer-events:none;}
#morePanel.open{transform:scale(1) translateZ(0);opacity:1;visibility:visible}
#morePanel .more-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:500;color:var(--text);transition:.15s;user-select:none;white-space:nowrap;position:relative;z-index:1;}
#morePanel .more-item:active{background:var(--bg)}
#morePanel .more-item .mi-icon{font-size:20px}

#emojiPanel{position:fixed;bottom:0;left:0;right:0;background:var(--card-bg);border-top:1px solid var(--border);max-height:50vh;z-index:9998;transform:translateY(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding:8px 12px calc(8px + var(--safe-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.15);max-width:480px;margin:0 auto;border-radius:16px 16px 0 0}
#emojiPanel.open{transform:translateY(0)}
#emojiPanel .panel-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--border);flex-shrink:0}
#emojiPanel .panel-header .title{font-weight:600;font-size:16px}
#emojiPanel .panel-header .close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-light);padding:4px 8px}
#emojiPanel .emoji-scroll{flex:1;overflow-y:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
#emojiPanel .emoji-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#emojiPanel .emoji-grid .emoji-item{aspect-ratio:1/1;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
#emojiPanel .emoji-grid .emoji-item:active{transform:scale(.94);background:var(--bg)}
#emojiPanel .emoji-grid .emoji-item img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
#emojiPanel .panel-actions{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--border);flex-shrink:0}
#emojiPanel .panel-actions .pat-btn,#emojiPanel .panel-actions .manage-btn{flex:1;padding:10px;border-radius:20px;font-size:15px;font-weight:500;cursor:pointer;text-align:center;transition:.2s}
#emojiPanel .panel-actions .pat-btn{background:var(--primary);color:#fff;border:none}
#emojiPanel .panel-actions .manage-btn{background:var(--bg);color:var(--text);border:1px solid var(--border)}
#plusPanel{position:fixed;inset:0;z-index:5000;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1.05);max-width:480px;margin:0 auto;box-shadow:0 -8px 40px rgba(0,0,0,.15)}
#plusPanel.open{transform:translateY(0)}
.plus-header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-top)) 16px 12px;background:var(--header-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.plus-header .plus-title{font-size:17px;font-weight:600}
.plus-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);padding:4px 8px;border-radius:8px}
.plus-body{flex:1;overflow-y:auto;padding:0 0 40px;-webkit-overflow-scrolling:touch}
.plus-body-inner{padding:12px 16px 0}
#letterPanel{position:fixed;inset:0;z-index:5400;background:linear-gradient(180deg,#FFF9F0,#FFF3E0);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1.05);max-width:480px;margin:0 auto;color:#5B4636}
#letterPanel.open{transform:translateY(0)}
.letter-header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-top)) 16px 12px;border-bottom:1px solid rgba(91,70,54,.12);flex-shrink:0;background:rgba(255,255,255,.6)}
.letter-header .title{font-size:17px;font-weight:600;letter-spacing:1px;color:#8B5E3C}
.letter-close{background:none;border:none;font-size:22px;color:#8B5E3C;cursor:pointer;padding:4px 8px;border-radius:8px}
.letter-body{flex:1;overflow-y:auto;padding:14px 16px 40px;-webkit-overflow-scrolling:touch}
.letter-settings{background:#fff;border:1px solid rgba(91,70,54,.12);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.letter-setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;flex-wrap:wrap}
.letter-setting-row + .letter-setting-row{border-top:1px dashed rgba(91,70,54,.1)}
.letter-setting-row .ls-label{font-size:13px;color:#8B5E3C;font-weight:500;flex-shrink:0}
.letter-setting-row .ls-value{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.letter-input{width:56px;padding:6px 8px;border:1px solid rgba(91,70,54,.2);border-radius:8px;font-size:13px;background:#FFFDF9;color:#5B4636;outline:none;text-align:center;font-family:inherit}
.letter-input[disabled]{opacity:.45;background:#F5F0E8;cursor:not-allowed}
.letter-toggle{position:relative;width:44px;height:24px;background:#E0D5C5;border-radius:12px;cursor:pointer;transition:.2s;flex-shrink:0}
.letter-toggle.active{background:#D4A574}
.letter-toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.letter-toggle.active::after{left:22px}
.letter-hint{font-size:11px;color:#A08872;line-height:1.6;padding:2px 0 0}
.letter-write-btn{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#D4A574,#C08B5C);color:#fff;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.2s;margin:10px 0 16px;box-shadow:0 4px 14px rgba(192,139,92,.3)}
.letter-list-title{font-size:13px;font-weight:600;color:#8B5E3C;margin:6px 4px 10px;letter-spacing:.5px}
.letter-list{display:flex;flex-direction:column;gap:10px}
.letter-item{position:relative;background:#fff;border:1px solid rgba(91,70,54,.12);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s}
.letter-item .li-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.letter-item .li-from{font-size:13px;font-weight:600;color:#8B5E3C}
.letter-item .li-from.partner{color:#C08B5C}
.letter-item .li-time{font-size:11px;color:#B8A48C;margin-left:auto}
.letter-item .li-preview{font-size:13px;color:#7A6350;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.letter-item .li-reply-tag{margin-top:8px;font-size:12px;color:#C08B5C;background:#FFF6EC;border-radius:8px;padding:6px 10px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.letter-badge{position:absolute;top:-6px;right:-6px;font-size:18px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.letter-empty{text-align:center;padding:50px 20px;color:#B8A48C;font-size:14px}
.letter-empty .le-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.letter-reader{position:fixed;inset:0;z-index:10005;background:rgba(91,70,54,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}

.word-card-item{background:var(--card-bg);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);gap:8px}
.word-card-item.disabled{opacity:.55;background:#f8f9fb;}
.word-card-item.disabled .card-word{text-decoration:line-through;color:var(--text-light);}
.word-card-item .card-word{font-size:14px;flex:1;word-break:break-word}
.word-card-item .card-actions{display:flex;flex-shrink:0}
.word-card-item .card-actions button{background:none;border:none;font-size:16px;color:var(--text-light);cursor:pointer;padding:2px 6px}
/* ===== 批量删除相关 ===== */
.wc-batch-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:#fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;transition:.15s;}
.wc-batch-check.on{background:#ef4444;border-color:#ef4444;}
.wc-batch-bar{display:flex;align-items:center;gap:10px;padding:8px 4px 10px;border-bottom:1px solid var(--border);margin-bottom:8px;flex-wrap:wrap;}
.wc-batch-bar .wc-batch-all{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none;}
.wc-batch-bar .wc-batch-count{margin-left:auto;font-size:12px;color:var(--text-light);}
.wc-batch-bar .wc-batch-count b{color:#ef4444;}
.wc-batch-btn-del{background:#ef4444;color:#fff;border:none;padding:7px 14px;border-radius:18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
.wc-batch-btn-del[disabled]{opacity:.45;cursor:not-allowed;}
.wc-batch-btn-exit{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:7px 14px;border-radius:18px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light);font-size:14px}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.emoji-manage-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.emoji-manage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.emoji-manage-item{background:var(--card-bg);border-radius:var(--radius-sm);padding:6px;border:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.emoji-manage-item .thumb{aspect-ratio:1/1;background:#fff;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.emoji-manage-item .thumb img{width:100%;height:100%;object-fit:contain}
.emoji-manage-item .item-actions{display:flex;gap:4px;justify-content:center}
.emoji-manage-item .item-actions button{flex:1;background:none;border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text-light);cursor:pointer;padding:3px 0}
.emoji-manage-item .item-actions button.danger{color:#ef4444;border-color:#fecaca}
.te-list{display:flex;flex-wrap:wrap;gap:8px}
.te-item{display:flex;align-items:center;gap:6px;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:6px 6px 6px 12px;max-width:100%}
.te-item .te-text{font-size:15px;word-break:break-all}
.te-item .te-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:14px;padding:0 4px;flex-shrink:0;line-height:1}
.btn-primary{background:var(--primary);color:#fff;border:none;padding:8px 18px;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer}
.btn-danger{background:#ef4444;color:#fff;border:none;padding:8px 16px;border-radius:18px;font-size:13px;cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);animation:fadeIn .2s ease}
.modal-box{background:#fff;border-radius:var(--radius);padding:24px 20px 20px;max-width:360px;width:100%;max-height:82vh;overflow-y:auto;color:#1a1a2e;animation:slideUp .25s ease}
.modal-box .modal-title{font-size:18px;font-weight:600;margin-bottom:16px;text-align:center}
.modal-box label{font-size:13px;font-weight:500;color:#6b7280;display:block;margin-top:12px;margin-bottom:4px}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:15px;font-family:inherit;background:#f5f7fa;outline:none;color:#1a1a2e}
.modal-box .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.modal-box .modal-actions button{padding:8px 20px;border-radius:20px;border:none;font-size:14px;font-weight:500;cursor:pointer}
.modal-box .modal-actions .btn-cancel{background:#e5e7eb;color:#1a1a2e}
.modal-box .modal-actions .btn-confirm{background:var(--primary);color:#fff}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.setting-section{margin-top:14px}
.setting-section .section-header{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 8px;cursor:pointer}
.setting-section .section-header .section-title{font-size:13px;font-weight:600;color:var(--text-light);letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.setting-section .section-header .section-arrow{font-size:12px;color:var(--text-light);transition:transform .25s;display:inline-block}
.setting-section.collapsed .section-header .section-arrow{transform:rotate(-90deg)}
.setting-section.collapsed .section-content{display:none}
.setting-item{background:var(--card-bg);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);flex-wrap:wrap;gap:8px}
.setting-item .label{font-size:14px;font-weight:500}
.setting-item .value{font-size:14px;color:var(--text-light);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.setting-item .value input[type=number],.setting-item .value input[type=text]{border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:14px;background:var(--bg);width:70px;outline:none;color:var(--text)}
.setting-item .value input[type=color]{width:40px;height:40px;padding:2px;border-radius:50%;border:1px solid var(--border);background:var(--bg);cursor:pointer}
.setting-item .value input[type=range]{width:120px;accent-color:var(--primary)}
.setting-item .value .edit-trigger{font-size:14px;color:var(--primary);cursor:pointer}
.setting-item .value .toggle-switch{position:relative;width:44px;height:24px;background:var(--border);border-radius:12px;cursor:pointer;transition:.2s;flex-shrink:0;z-index:1}
.setting-item .value .toggle-switch.active{background:var(--primary)}
.setting-item .value .toggle-switch::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.setting-item .value .toggle-switch.active::after{left:22px}
.setting-item .value .bg-preview{width:56px;height:56px;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--border);background-color:var(--bg)}
.setting-sub{font-size:12px;color:var(--text-light);margin-top:6px;line-height:1.6;padding:0 4px}
.skin-presets{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:0 4px}
.skin-preset{width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:.2s}
.sub-group-title{font-size:12px;font-weight:600;color:var(--primary);margin:14px 4px 6px;letter-spacing:.5px;display:flex;align-items:center;gap:6px;opacity:.85}
.sub-group-title::before{content:'';display:inline-block;width:3px;height:12px;background:var(--primary);border-radius:2px}
.custom-css-wrap{display:flex;flex-direction:column;gap:8px}
.custom-css-wrap textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--text);outline:none;resize:vertical;min-height:180px;line-height:1.5}
.custom-css-actions{display:flex;gap:8px}
.call-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.call-box{background:#1a1a2e;color:#fff;border-radius:30px;padding:32px 24px 28px;width:290px;text-align:center;position:relative}
.call-box .call-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;overflow:hidden;border:3px solid var(--primary-light);background:var(--border)}
.call-box .call-avatar img{width:100%;height:100%;object-fit:cover}
.call-box .call-avatar .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:600;color:#fff;background:var(--primary)}
.call-box .call-name{font-size:22px;font-weight:600;margin-bottom:4px}
.call-box .call-status{font-size:14px;color:#9ca3af;margin-bottom:8px;min-height:20px}
.call-box .call-countdown{font-size:13px;color:#FBBF24;margin-bottom:12px;min-height:18px}
.call-box .call-timer{font-size:28px;font-weight:300;margin-bottom:24px;font-variant-numeric:tabular-nums}
.call-box .call-actions{display:flex;justify-content:center;gap:20px}
.call-box .call-actions button{width:60px;height:60px;border-radius:50%;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.call-box .call-actions .btn-end{background:#ef4444;color:#fff}
.call-box .call-actions .btn-answer{background:#34d399;color:#fff;animation:pulseBtn 1.2s infinite}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}50%{box-shadow:0 0 0 12px rgba(52,211,153,0)}}
.call-box .call-minimize{position:absolute;top:12px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;padding:4px 8px;border-radius:8px;cursor:pointer}
#callMini{position:fixed;right:16px;bottom:130px;width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;display:none;align-items:center;justify-content:center;font-size:24px;z-index:10001;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:grab;border:2px solid #fff;touch-action:none}
#callMini .mini-timer{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-light);background:rgba(255,255,255,.95);padding:1px 6px;border-radius:8px;white-space:nowrap;font-weight:600;pointer-events:none}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:8px 20px;border-radius:20px;font-size:14px;z-index:99999;pointer-events:none;animation:fadeIn .3s ease;backdrop-filter:blur(4px);max-width:80%}
.toast.hide{opacity:0;transition:.3s}
.typing-indicator{display:flex;gap:4px;padding:10px 14px;background:var(--bubble-other);border-radius:var(--bubble-radius);border-bottom-left-radius:4px;align-self:flex-start}
.typing-indicator span{width:7px;height:7px;background:var(--text-light);border-radius:50%;animation:typing 1.2s infinite ease-in-out}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-6px);opacity:1}}
.status-tag{display:inline-flex;align-items:center;background:var(--border);padding:3px 10px;border-radius:12px;font-size:13px;margin:3px 4px 3px 0}
.status-tag .del-status{margin-left:6px;cursor:pointer;color:#ef4444;font-weight:600}
.export-options{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.export-option{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--bg)}
.export-option .eo-check{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;color:#fff;font-size:14px;font-weight:700}
.export-option.checked .eo-check{background:var(--primary);border-color:var(--primary)}
.export-option .eo-text{flex:1;font-size:14px}
.export-option .eo-sub{font-size:12px;color:var(--text-light)}
.brand-sign{text-align:center;font-size:12px;color:#9ca3af;padding:22px 0 10px;letter-spacing:.5px;line-height:1.6;user-select:text;-webkit-user-select:text;}
.sound-file-btn{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:4px 10px;font-size:12px;color:var(--text);cursor:pointer;font-family:inherit}
.music-manage-row{display:flex;align-items:center;gap:10px;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:11px 12px}
.music-manage-row .mm-check{width:20px;height:20px;border:2px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;cursor:pointer;color:#fff;font-size:13px;font-weight:700}
.music-manage-row .mm-info{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.music-manage-row .mm-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:2px 6px;flex-shrink:0}
.music-manage-row .mm-rename{color:var(--primary)}
.music-manage-row .mm-del{color:#ef4444}

/* ===== 设置分类卡片 ===== */
.settings-card{display:flex;align-items:center;gap:14px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
.settings-card:active{transform:scale(.985);background:var(--bg);}
.settings-card .sc-icon{width:46px;height:46px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.settings-card .sc-info{flex:1;min-width:0;}
.settings-card .sc-title{font-size:15px;font-weight:600;margin-bottom:3px;}
.settings-card .sc-desc{font-size:12px;color:var(--text-light);line-height:1.5;}
.settings-card .sc-arrow{font-size:20px;color:var(--text-light);flex-shrink:0;opacity:.6;}
.settings-subbar{margin-bottom:12px;}
.settings-back-btn{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:8px 18px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit;box-shadow:var(--shadow);}
.settings-back-btn:active{background:var(--bg);}

/* ===== 后台保活 UI（参照传讯）===== */
.keepalive-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9ca3af;transition:background .3s;flex-shrink:0;vertical-align:middle;}
.keepalive-dot.active{background:#10b981;animation:keepaliveDotPulse 1.4s ease-in-out infinite;}
@keyframes keepaliveDotPulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.55);}50%{box-shadow:0 0 0 7px rgba(16,185,129,0);}}
.keepalive-bar-row{display:none;align-items:center;gap:3px;padding:8px 14px 10px;border-top:1px solid var(--border);background:rgba(74,144,217,.05);border-radius:0 0 var(--radius-sm) var(--radius-sm);}
.keepalive-bar-row.show{display:flex;}
.keepalive-wave-bar{width:3px;height:14px;background:var(--primary);border-radius:2px;animation:keepaliveWave 1.1s ease-in-out infinite;transform-origin:center;}
@keyframes keepaliveWave{0%,100%{transform:scaleY(.3);opacity:.45;}50%{transform:scaleY(1);opacity:1;}}
/* 撤回气泡统一外观，避免我方蓝底灰字看不清 */
.msg-bubble.recall-bubble,
.msg-group.me .msg-bubble.recall-bubble,
.msg-group.other .msg-bubble.recall-bubble{
    background:rgba(0,0,0,.05);
    color:var(--text-light);
    box-shadow:none;
    font-size:13px;
    max-width:100%;
}
/* 引用条可点击 */
.reply-ref{cursor:pointer;}
.reply-ref:active{opacity:.65;}
</style>

function deepMerge(t,s){
    if(!s||typeof s!=='object') return t;
    if(!t||typeof t!=='object') return s;
    const o=Array.isArray(t)?t.slice():Object.assign({},t);
    for(const k in s){
        const v=s[k];
        if(v===undefined||v===null) continue;
        if(Array.isArray(v)) o[k]=v.slice();
        else if(typeof v==='object') o[k]=deepMerge(t[k]||{},v);
        else o[k]=v;
    }
    return o;
}

/* ===================== 存储 ===================== */
let saveTimer=null,_idbMirrorTimer=null,_storageWarned=false,_idbPromise=null;
function openIDB(){
    if(_idbPromise) return _idbPromise;
    _idbPromise=new Promise(resolve=>{
        try{
            if(!window.indexedDB){resolve(null);return;}
            const req=indexedDB.open('lingji_db',1);
            req.onupgradeneeded=()=>{try{if(!req.result.objectStoreNames.contains('kv'))req.result.createObjectStore('kv');}catch(e){}};
            req.onsuccess=()=>resolve(req.result);
            req.onerror=()=>resolve(null);
        }catch(e){resolve(null);}
    });
    return _idbPromise;
}
function idbSet(key,val){openIDB().then(db=>{if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put(val,key);}catch(e){}}).catch(()=>{});}
function idbGet(key){return openIDB().then(db=>new Promise(resolve=>{if(!db){resolve(null);return;}try{const r=db.transaction('kv','readonly').objectStore('kv').get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null);}catch(e){resolve(null);}})).catch(()=>null);}
function mirrorToIDB(json){
    if(_idbMirrorTimer){clearTimeout(_idbMirrorTimer);}
    _idbMirrorTimer=setTimeout(()=>{
        _idbMirrorTimer=null;
        try{idbSet('data',json);}catch(e){}
    },800);
}
function saveNow(){
    let json;
    try{json=JSON.stringify(data);}catch(e){return;}
    try{localStorage.setItem(STORAGE_KEY,json);mirrorToIDB(json);return;}catch(e){}
    try{
        const slim=JSON.parse(json);
        if(slim.music&&Array.isArray(slim.music.list)){
            const musicUrls=[];
            slim.music.list=slim.music.list.map(s=>{
                if(s&&s.source==='file'&&s.url&&String(s.url).length>20000){
                    musicUrls.push({id:s.id,url:s.url});
                    return Object.assign({},s,{url:''});
                }
                return s;
            });
            if(musicUrls.length){try{idbSet('music_urls',musicUrls);}catch(err){}}
        }
        if(Array.isArray(slim.messages)) slim.messages=slim.messages.map(m=>{if(m&&m.type==='image'&&String(m.content||'').length>150000) return Object.assign({},m,{content:'',type:'text'});return m;});
        if(Array.isArray(slim.emojis)&&slim.emojis.some(e=>e&&e.dataUrl)){
            try{idbSet('emojis',slim.emojis.map(e=>({id:e.id,dataUrl:e.dataUrl||''})));}catch(err){}
            slim.emojis=slim.emojis.map(e=>({id:e.id,dataUrl:''}));
        }
        const slimJson=JSON.stringify(slim);
        localStorage.setItem(STORAGE_KEY,slimJson);mirrorToIDB(slimJson);
        if(!_storageWarned){_storageWarned=true;showToast('⚠️ 存储空间紧张，已自动精简保存，请尽快导出备份',3500);}
        return;
    }catch(e2){}
    try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
    try{idbSet('data',json);}catch(e){}
    try{if(Array.isArray(data.emojis)&&data.emojis.length) idbSet('emojis',data.emojis.map(e=>({id:e.id,dataUrl:e.dataUrl||''})));}catch(e){}
    if(!_storageWarned){_storageWarned=true;showToast('⚠️ 本地存储写入失败，已保存到本地镜像备份',3500);}
}
function flushSave(){
    if(saveTimer){clearTimeout(saveTimer);saveTimer=null;}
    if(_idbMirrorTimer){clearTimeout(_idbMirrorTimer);_idbMirrorTimer=null;}

const scheduler={
    tasks:[],seq:0,
    add(fn,delayMs,key){const id=++this.seq;this.tasks.push({id,key:key||null,time:Date.now()+Math.max(0,delayMs),fn});return id;},
    cancelByKey(key){this.tasks=this.tasks.filter(t=>t.key!==key);},
    tick(){const now=Date.now();const due=[];this.tasks=this.tasks.filter(t=>{if(t.time<=now){due.push(t);return false;}return true;});due.forEach(t=>{try{t.fn();}catch(e){console.error(e);}});}
};
function startTickWorker(){
    setInterval(()=>scheduler.tick(),1000);
    try{const code='setInterval(function(){ self.postMessage(Date.now()); }, 300);';const blob=new Blob([code],{type:'application/javascript'});const w=new Worker(URL.createObjectURL(blob));w.onmessage=()=>scheduler.tick();}catch(e){}
    document.addEventListener('visibilitychange',()=>{scheduler.tick();if(!document.hidden)unreadCount=0;});
    window.addEventListener('focus',()=>{scheduler.tick();unreadCount=0;});
}

function buildSilentWavBlob(durationSec){
    const sr=8000;
    const ns=Math.max(1,Math.round(sr*(durationSec||1)));
    const buf=new ArrayBuffer(44+ns*2);
    const v=new DataView(buf);
    const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
    ws(0,'RIFF');v.setUint32(4,36+ns*2,true);ws(8,'WAVE');ws(12,'fmt ');
    v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);
    v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,ns*2,true);
    return new Blob([buf],{type:'audio/wav'});
}
function startKeepAliveAudio(){

        if(!keepAliveAudio){
         keepAliveAudio=new Audio(URL.createObjectURL(buildSilentWavBlob(1)));
            keepAliveAudio.loop=true;
            keepAliveAudio.muted=true;
            keepAliveAudio.volume=0;
            try{keepAliveAudio.setAttribute('muted','');}catch(e){}

            updateKeepAliveUI(true);

}

function dedupeWordCards(){

    safe=safe.replace(/["'<>\\]/g,'');
    if(/\.woff2(\?|#|$)/i.test(u)) return 'url("'+safe+'") format("woff2")';
    if(/\.woff(\?|#|$)/i.test(u)) return 'url("'+safe+'") format("woff")';
    if(/\.otf(\?|#|$)/i.test(u)) return 'url("'+safe+'") format("opentype")';
    if(/\.ttf(\?|#|$)/i.test(u)) return 'url("'+safe+'") format("truetype")';

function checkFontLoaded(url){
    const seq=++_fontLoadSeq;
    const root=document.documentElement;
    const finish=(ok,msg)=>{
        if(seq!==_fontLoadSeq) return;
        if(ok){root.classList.add('user-font-active');}
        else if(msg){showToast(msg,4500);}
    };
    const verify=()=>{
        if(seq!==_fontLoadSeq) return false;
        try{
            if(document.fonts&&document.fonts.check&&document.fonts.check('16px "LingjiUserFont"')) return true;
        }catch(e){}
        return false;
    };
    const start=()=>{
        if(seq!==_fontLoadSeq) return;
        if(!(document.fonts&&document.fonts.load)){finish(true);return;}
        let settled=false;
        const timer=setTimeout(()=>{
            if(settled||seq!==_fontLoadSeq) return;
            settled=true;
            if(verify()){finish(true);return;}
            showToast('⏳ 字体加载较慢，若长时间未生效请检查链接是否可直连',4500);
        },15000);
        document.fonts.load('16px "LingjiUserFont"').then(faces=>{
            if(settled||seq!==_fontLoadSeq) return;
            settled=true;clearTimeout(timer);
            if(faces&&faces.length){finish(true);}
            else if(verify()){finish(true);}
            else{finish(false,'⚠️ 字体可能加载失败，请确认链接是字体直链且允许跨域');}
        }).catch(()=>{
            if(settled||seq!==_fontLoadSeq) return;
            settled=true;clearTimeout(timer);
            if(verify()) finish(true);
            else finish(false,'⚠️ 字体可能加载失败，请确认链接是字体直链且允许跨域');
        });
    };
    if(typeof requestAnimationFrame==='function'){
        requestAnimationFrame(()=>setTimeout(start,30));
    }else{
        setTimeout(start,30);
    }
}

function buildMessageHtml(m,msgs){
    if(m.type==='pat'){
        const full=m.content||'';
        const name=m.sender==='me'?(data.user.name||'我'):(data.partner.name||'对方');
        let rest=full;
        if(full.indexOf(name)===0) rest=full.slice(name.length).trim();
        return '<div class="msg-system-center"><span><span class="sys-icon">👋</span><b>'+esc(name)+'</b> '+esc(rest)+'</span></div>';
    }
    if(m.type==='music'){
        const name=m.sender==='me'?(data.user.name||'我'):(data.partner.name||'对方');
        let rest=m.content||'';
        if(rest.indexOf(name)===0) rest=rest.slice(name.length).trim();
        return '<div class="msg-system-center"><span><span class="sys-icon">🎧</span><b>'+esc(name)+'</b> '+esc(rest)+'</span></div>';
    }
    if(m.type==='call') return '<div class="msg-system-center"><span><span class="sys-icon">📞</span>'+esc(m.content)+'</span></div>';

        const hasRecalled=(m.recalledType==='image'||m.recalledType==='emoji'||typeof m.recalledContent==='string')&&(m.recalledContent!==undefined&&m.recalledContent!==null);
        if(hasRecalled){

            const groupClass=isMe?'me':'other';
            const timeStr=formatTime(m.timestamp);
            const showAvatar=data.settings&&data.settings.showAvatar!==false;
            const avatarHtml=showAvatar?'<div class="msg-avatar">'+avatarHtmlFor(m.sender)+'</div>':'';
            const sideHtml='<div class="msg-side">'+avatarHtml+'<span class="msg-side-time">'+timeStr+'</span></div>';
            const recallContent='<span style="color:var(--text-light);font-size:13px;">'+esc(m.content)+'</span>';
            return '<div class="msg-group '+groupClass+'" data-id="'+m.id+'">'+sideHtml+'<div class="msg-body"><div class="msg-bubble recall-bubble" onclick="toggleRecallMessage(this, \''+m.id+'\')">'+recallContent+'</div></div></div>';
        }
        return '<div class="msg-system-center"><span><span class="sys-icon">↩</span>'+esc(m.content)+'</span></div>';
    }
    if(m.type==='readno') return '<div class="msg-system-center"><span><span class="sys-icon">👀</span>'+esc(m.content)+'</span></div>';
    const isMe=m.sender==='me';

    const timeStr=formatTime(m.timestamp);

    let contentHtml='',replyHtml='',hasReply=false;
    if(m.replyTo){
        const ref=msgs.find(x=>x.id===m.replyTo);

            hasReply=true;
            let refText=ref.content||'[消息]';
            if(ref.type==='emoji'||ref.type==='image') refText='[图片]';
            if(ref.type==='recall') refText=ref.content||'[已撤回]';
            if(refText.length>24) refText=refText.slice(0,24)+'…';
            const refWho=ref.sender==='me'?'我':(data.partner.name||'对方');
            replyHtml='<span class="reply-ref" onclick="event.stopPropagation();jumpToMessage(\''+ref.id+'\')">↩ '+esc(refWho)+': '+esc(refText)+'</span>';
        }
    }
    let bubbleClass='msg-bubble';
    if(m.type==='emoji'||m.type==='image'){
        bubbleClass+=' emoji-bubble';
        if(hasReply) bubbleClass+=' has-reply';
        const imgClass=m.type==='image'?'emoji-img img-large':'emoji-img';
        contentHtml=replyHtml+'<img src="'+esc(m.content)+'" class="'+imgClass+'" loading="lazy" decoding="async">';
    }else{
        contentHtml=replyHtml+esc(m.content||'');
    }
    const autoBadge=(m.isAuto&&!isMe)?'<span class="auto-badge">❤️</span>':'';
    const avatarHtml=showAvatar?'<div class="msg-avatar">'+avatarHtmlFor(m.sender)+'</div>':'';

function compressImageFile(file,maxDim,quality){
    return new Promise(resolve=>{
        try{
            const reader=new FileReader();
            reader.onload=ev=>{
                const raw=ev.target.result,img=new Image();
                img.onload=()=>{
                    try{
                        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
                        if(!w||!h){resolve(raw);return;}
                        if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
                        const c=document.createElement('canvas');c.width=w;c.height=h;
                        c.getContext('2d').drawImage(img,0,0,w,h);
                        resolve(c.toDataURL('image/jpeg',quality));
                    }catch(e){resolve(raw);}
                };
                img.onerror=()=>resolve(raw);img.src=raw;
            };
            reader.onerror=()=>resolve(null);reader.readAsDataURL(file);
        }catch(e){resolve(null);}
    });
}

function schedulePartnerReply(){
    scheduler.cancelByKey('reply');
    const s=data.replySettings;
    let minS=Number(s.minSeconds),maxS=Number(s.maxSeconds);
    if(isNaN(minS)||minS<0.5) minS=3;
    if(isNaN(maxS)||maxS<0.5) maxS=30;
    if(maxS<minS){const t=minS;minS=maxS;maxS=t;}
    const delay=(minS+Math.random()*(maxS-minS))*1000;
    scheduler.add(()=>generatePartnerReply(),delay,'reply');
}

function buildSpellSentence(){
    const s=data.replySettings;
    let minC=Math.max(1,Math.round(Number(s.spellMinCount)||2));
    let maxC=Math.max(1,Math.round(Number(s.spellMaxCount)||3));
    if(maxC<minC){const t=minC;minC=maxC;maxC=t;}
    const cards=getAllCards();if(!cards.length) return '';
    const count=clamp(randInt(minC,maxC),1,cards.length);
    const pool=cards.slice();
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    return pool.slice(0,count).join('，');
}
function schedulePartnerRecall(msgId){
    const s=data.replySettings||{};
    if(!s.recallEnabled) return;
    const prob=Number(s.recallProbability);
    if(isNaN(prob)||prob<=0) return;
    if(Math.random()>=prob) return;
    const delay=2500+Math.random()*4000;
    scheduler.add(()=>{
        const msgs=data.messages||[];
        const idx=msgs.findIndex(m=>m.id===msgId);
        if(idx<0) return;
        const m=msgs[idx];
        if(!m||m.sender!=='partner') return;
        if(m.type!=='text'&&m.type!=='emoji'&&m.type!=='image') return;
        
        m.recalledType = m.type;
        m.recalledContent = m.content||'';
        m.type = 'recall';
        m.content = (data.partner.name||'对方')+' 撤回了一条消息';
        m.replyTo = null;
        saveData();
        
        const el=document.querySelector('.msg-group[data-id="'+msgId+'"]');
        if(el){
            const tempDiv=document.createElement('div');
            tempDiv.innerHTML=buildMessageHtml(m, msgs);
            el.parentNode.replaceChild(tempDiv.firstElementChild, el);
        }
    },delay,'recall_'+msgId);
}

function generatePartnerReply(){
    hideTypingIndicator();
    const s=data.replySettings;
    if(s.seenNoReplyEnabled&&Math.random()<0.15){
        const pname=data.partner.name||'对方';
        addMessage('partner',pname+' 已读不回','readno',null,true);
        afterPartnerReply();return;
    }
    const allCardsSpell=getAllCards();
    if(s.spellEnabled&&allCardsSpell.length>0&&Math.random()<0.5){
        const sentence=buildSpellSentence();
        if(sentence){
            const quoteProb=Number(s.quoteProbability);
            const willQuote=Math.random()<(isNaN(quoteProb)?0.35:quoteProb);
            const quoteId=willQuote?pickQuoteTarget():null;
            addMessage('partner',sentence,'text',quoteId);
            afterPartnerReply();return;
        }
    }
    let minC=Number(s.cardReplyMinCount),maxC=Number(s.cardReplyMaxCount);
    if(isNaN(minC)||minC<1) minC=1;
    if(isNaN(maxC)||maxC<1) maxC=5;
    if(maxC<minC){const t=minC;minC=maxC;maxC=t;}
    minC=Math.round(minC);maxC=Math.round(maxC);
    const allCards=getAllCards();
    const count=clamp(randInt(minC,maxC),1,20);
    const emojiProb=Number(s.emojiReplyProbability)||0;
    const hasEmoji=Array.isArray(data.emojis)&&data.emojis.length>0;
    const willSendEmoji=hasEmoji&&Math.random()<emojiProb;
    const quoteProb=Number(s.quoteProbability);
    const willQuote=Math.random()<(isNaN(quoteProb)?0.35:quoteProb);
    const quoteId=willQuote?pickQuoteTarget():null;
    const teList=Array.isArray(data.textEmojis)?data.textEmojis:[];
    const teOn=!!s.textEmojiEnabled&&teList.length>0;
    let teProb=Number(s.textEmojiProbability);if(isNaN(teProb))teProb=0.2;
    const willTextEmoji=teOn&&Math.random()<teProb;
    const teWithCard=s.textEmojiWithCard!==false;
    const teText=willTextEmoji?pickTextEmoji():'';
    if(willTextEmoji&&!teWithCard){
        scheduler.add(()=>{addMessage('partner',teText,'text',quoteId);afterPartnerReply();},300+Math.random()*400,'replyTextEmoji');
        return;
    }
    if(allCards.length===0&&!willSendEmoji){
        const fb=['嗯嗯','好的','明白','收到','👍','哈哈','好的呢','了解','在的','怎么啦'];
        let content=fb[Math.floor(Math.random()*fb.length)];
        if(willTextEmoji&&teText) content=content+' '+teText;
        addMessage('partner',content,'text',quoteId);afterPartnerReply();return;
    }
    if(allCards.length>0){
        const shuffled=allCards.slice();
        for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
        const selected=shuffled.slice(0,count);
        const step=Math.max(300,Math.min(700,Math.round(2200/Math.max(1,selected.length))));
        selected.forEach((word,index)=>{
            scheduler.add(()=>{
                let content=word;
                if(index===selected.length-1&&willTextEmoji&&teText) content=content+' '+teText;
                addMessage('partner',content,'text',index===0?quoteId:null);
                if(index===selected.length-1){
                    if(willSendEmoji){
                        scheduler.add(()=>{const emoji=data.emojis[Math.floor(Math.random()*data.emojis.length)];addMessage('partner',emoji.dataUrl,'emoji',null);afterPartnerReply();},400,'replyEmoji');
                    }else afterPartnerReply();
                }
            },index*step+200,'replySeq_'+index);
        });
    }else if(willSendEmoji){
        scheduler.add(()=>{const emoji=data.emojis[Math.floor(Math.random()*data.emojis.length)];addMessage('partner',emoji.dataUrl,'emoji',null);afterPartnerReply();},400,'replyEmoji');
    }
}

function maybePartnerWriteLetter(){
    const L=data.letters;if(!L||!L.settings) return;
    const s=L.settings;
    if(!s.partnerAutoEnabled) return;
    if(callState&&callState.active) return;
    ensureLetterDailyReset();
    if(s.dailyWriteCount>=s.dailyLimitValue) return;
    let prob=Number(s.autoProbability);if(isNaN(prob))prob=0;
    if(Math.random()>=prob) return;
    let minM=Number(s.writeMinMinutes),maxM=Number(s.writeMaxMinutes);
    if(isNaN(minM)||minM<0.1) minM=5;
    if(isNaN(maxM)||maxM<0.1) maxM=30;
    if(maxM<minM){const t=minM;minM=maxM;maxM=t;}
    const delayMs=(minM+Math.random()*(maxM-minM))*60000;
    scheduler.add(()=>{ensureLetterDailyReset();if(s.dailyWriteCount>=s.dailyLimitValue)return;writePartnerLetter();},delayMs,'partnerLetterWrite');
}
function writePartnerLetter(){
    const L=data.letters,s=L.settings;
    const cards=getAllCards();
    let minC=Math.max(1,Math.round(Number(s.cardMin)||1));
    let maxC=Math.max(1,Math.round(Number(s.cardMax)||3));
    if(maxC<minC){const t=minC;minC=maxC;maxC=t;}
    const count=clamp(randInt(minC,maxC),1,30);
    let content='';
    if(cards.length===0) content='（今天没有字卡可写…）';
    else{const sh=cards.slice();for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}content=sh.slice(0,count).join('\n');}
    const letter={id:genId(),from:'partner',content,timestamp:Date.now(),reply:null,hasNew:true,badge:'heart'};
    L.list.unshift(letter);if(L.list.length>200)L.list=L.list.slice(0,200);
    s.dailyWriteCount++;saveData();updateLetterMenuDot();
    if(letterPanelOpen) renderLetterPage();
    playNotifySound();showSystemNotification({content:'💌 对方给你写了一封信',type:'text'});
    try{if(navigator.vibrate)navigator.vibrate([80,40,80]);}catch(e){}
}
function schedulePartnerReplyLetter(letterId){
    const L=data.letters,s=L.settings;
    let prob=Number(s.replyProbability);if(isNaN(prob))prob=0;
    if(Math.random()>=prob) return;
    let maxM=Number(s.replyMaxMinutes);if(isNaN(maxM)||maxM<0.1) maxM=60;
    const delayMs=Math.random()*maxM*60000;
    scheduler.add(()=>{
        const letter=L.list.find(x=>x.id===letterId);
        if(!letter||letter.reply) return;
        const cards=getAllCards();
        let minC=Math.max(1,Math.round(Number(s.cardMin)||1));
        let maxC=Math.max(1,Math.round(Number(s.cardMax)||3));
        if(maxC<minC){const t=minC;minC=maxC;maxC=t;}
        const count=clamp(randInt(minC,maxC),1,30);
        let content='';
        if(cards.length===0) content='（没有字卡可回…）';
        else{const sh=cards.slice();for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}content=sh.slice(0,count).join('\n');}
        letter.reply={content,timestamp:Date.now()};letter.hasNew=true;letter.badge='sparkle';
        saveData();updateLetterMenuDot();
        if(letterPanelOpen) renderLetterPage();

let musicAudio=null;
let pauseGuardToken=0;
function silentPauseAudio(){
    pauseGuardToken++;
    const myToken=pauseGuardToken;
    try{const a=getMusicAudio();if(a)a.pause();}catch(e){}
    setTimeout(()=>{if(pauseGuardToken===myToken)pauseGuardToken=0;},1200);

function getMusicAudio(){
    if(!musicAudio){
        musicAudio=new Audio();
        musicAudio.preload='metadata';
        musicAudio.volume=(data.music&&data.music.volume!=null)?data.music.volume:MUSIC_DEFAULT_VOLUME;
        musicAudio.addEventListener('timeupdate',updateMusicProgress);
        musicAudio.addEventListener('loadedmetadata',()=>{updateMusicProgress();updateMusicBottomBar();});
        musicAudio.addEventListener('ended',onMusicEnded);
        musicAudio.addEventListener('play',()=>{if(data.music){data.music.playing=true;saveData();}updateMusicPlayUI();updateMusicBottomBar();});
        musicAudio.addEventListener('pause',()=>{
            if(data.music){data.music.playing=false;saveData();}
            updateMusicPlayUI();updateMusicBottomBar();
            if(pauseGuardToken>0) return;
            if(data.music&&data.music.controlAllowed){data.music.controlAllowed=false;saveData();showToast('⏸ 已暂停播放，对方的切歌/暂停权限已收回');}
        });
        musicAudio.addEventListener('error',()=>showToast('⚠️ 音频加载失败，链接可能不可用'));
    }
    return musicAudio;
}

function resolveMusicUrl(song){
    if(!song) return '';
    if(song.source==='netease'&&song.neteaseId) return 'https://music.163.com/song/media/outer/url?id='+song.neteaseId+'.mp3';
    return song.url||'';
}
function parseMusicLink(input){
    const t=String(input||'').trim();if(!t) return null;
    if(/^\d{4,}$/.test(t)) return {source:'netease',neteaseId:t,url:'',name:'网易云 '+t,artist:''};
    const m=t.match(/[?&]id=(\d+)/);
    if(m&&/music\.163\.com/i.test(t)) return {source:'netease',neteaseId:m[1],url:'',name:'网易云 '+m[1],artist:''};
    if(/^https?:\/\//i.test(t)){
        let name=t.split('/').pop().split('?')[0]||'网络音乐';
        try{name=decodeURIComponent(name);}catch(e){}
        if(name.length>40) name=name.slice(0,40)+'…';
        return {source:'link',url:t,neteaseId:'',name:name||'网络音乐',artist:''};
    }
    return null;
}
async function fetchNeteaseSongInfo(id){
    const targets=['https://music.163.com/api/song/detail/?ids=['+id+']&id='+id,'https://music.163.com/api/song/detail?ids=['+id+']'];
    const proxies=[u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u),u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];
    for(const t of targets){
        for(const make of proxies){
            try{
                const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),6000);
                const r=await fetch(make(t),{signal:ctrl.signal});clearTimeout(timer);
                if(!r.ok) continue;
                const text=await r.text();let j=null;
                try{j=JSON.parse(text);}catch(e){continue;}
                let s=null;
                if(j&&j.songs&&j.songs[0]) s=j.songs[0];
                else if(j&&j.result&&j.result.songs&&j.result.songs[0]) s=j.result.songs[0];
                if(s){const name=s.name||'';const artists=(s.artists||s.ar||[]).map(a=>a.name).filter(Boolean).join(' / ');if(name)return {name,artist:artists};}
            }catch(e){}
        }
    }
    return null;
}

function updateMusicInviteProb(val){
    let n=parseFloat(val);if(isNaN(n)||n<0)n=0;if(n>100)n=100;
    if(!data.music) data.music={};data.music.inviteProbability=n/100;saveData();
    showToast('已设置：对方邀请听歌概率 '+Math.round(n)+'%');
}
function playMusicAt(index){
    const list=data.music.list;if(!list.length) return;
    index=((index%list.length)+list.length)%list.length;
    const song=list[index];
    const url=resolveMusicUrl(song);
    if(!url){showToast('该歌曲没有可播放地址');return;}
    data.music.currentIndex=index;
    const a=getMusicAudio();silentPauseAudio();a.src=url;a.volume=data.music.volume!=null?data.music.volume:MUSIC_DEFAULT_VOLUME;
    try{a.load();}catch(e){}
    const p=a.play();if(p&&p.catch)p.catch(()=>showToast('播放失败：链接不可用或受版权限制'));
    saveData();if(musicPanelOpen)renderMusicPage();updateMusicBottomBar();
}
function toggleMusicPlay(){
    const m=data.music;if(!m.list.length){showToast('请先添加音乐');return;}
    if(m.currentIndex<0){playMusicAt(0);return;}
    const a=getMusicAudio();if(!a.src){playMusicAt(m.currentIndex);return;}
    if(a.paused) a.play().catch(()=>showToast('播放失败'));else a.pause();
}
function musicNext(){
    const len=data.music.list.length;if(!len) return;
    const mode=data.music.loopMode||'list';
    if(mode==='shuffle'){
        if(len===1){playMusicAt(0);return;}
        let idx=data.music.currentIndex;
        while(idx===data.music.currentIndex) idx=Math.floor(Math.random()*len);
        playMusicAt(idx);return;
    }
    playMusicAt((data.music.currentIndex+1)%len);
}
function musicPrev(){
    const len=data.music.list.length;if(!len) return;
    const mode=data.music.loopMode||'list';
    if(mode==='shuffle'){
        if(len===1){playMusicAt(0);return;}
        let idx=data.music.currentIndex;
        while(idx===data.music.currentIndex) idx=Math.floor(Math.random()*len);
        playMusicAt(idx);return;
    }
    playMusicAt((data.music.currentIndex-1+len)%len);
}
function onMusicEnded(){
    const mode=data.music.loopMode||'list';
    if(mode==='one'){const a=getMusicAudio();try{a.currentTime=0;a.play();}catch(e){}return;}
    if(mode==='none'&&data.music.currentIndex>=data.music.list.length-1){data.music.playing=false;updateMusicPlayUI();updateMusicBottomBar();return;}
    musicNext();
}
function cycleMusicLoop(){
    const modes=['list','shuffle','one'];
    const cur=data.music.loopMode||'list';
    const idx=(modes.indexOf(cur)+1)%modes.length;
    data.music.loopMode=modes[idx];saveData();updateMusicBottomBar();
    showToast('播放模式：'+(modes[idx]==='one'?'单曲循环':(modes[idx]==='shuffle'?'随机播放':'顺序播放')));
}
function updateMusicProgress(){
    const a=musicAudio;if(!a) return;
    const bar=document.getElementById('musicProgressBar'),cur=document.getElementById('musicCurTime'),dur=document.getElementById('musicDurTime');
    if(bar&&a.duration&&isFinite(a.duration)&&a.duration>0) bar.style.width=(a.currentTime/a.duration*100)+'%';
    if(cur) cur.textContent=fmtMusicTime(a.currentTime);
    if(dur&&isFinite(a.duration)) dur.textContent=fmtMusicTime(a.duration);
}
function updateMusicPlayUI(){const cover=document.querySelector('.music-cover');if(cover)cover.classList.toggle('spinning',!!data.music.playing);}
function seekMusic(e){
    const a=getMusicAudio();if(!a||!a.duration||!isFinite(a.duration)) return;
    const bar=document.getElementById('musicProgress');if(!bar) return;
    const rect=bar.getBoundingClientRect();
    const clientX=(e.touches&&e.touches[0])?e.touches[0].clientX:e.clientX;
    const ratio=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
    a.currentTime=ratio*a.duration;updateMusicProgress();
}
let _musicFileInput=null;
function getMusicFileInput(){
    if(_musicFileInput) return _musicFileInput;
    const input=document.createElement('input');
    input.type='file';input.accept='audio/*';input.multiple=true;
    input.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;';
    document.body.appendChild(input);
    input.addEventListener('change',async function(e){
        const files=Array.from(e.target.files||[]);if(!files.length){input.value='';return;}
        showToast('正在读取 '+files.length+' 个文件...');
        let added=0,skipped=0;
        for(const file of files){
            if(file.size>8*1024*1024){skipped++;continue;}
            const dataUrl=await readFileAsDataURL(file);
            if(!dataUrl){skipped++;continue;}
            const name=file.name.replace(/\.[^.]+$/,'')||'本地音乐';
            data.music.list.push({id:genId(),name,artist:'',url:dataUrl,neteaseId:'',source:'file'});
            added++;
        }
        saveData();if(musicPanelOpen)renderMusicPage();input.value='';
        if(added) showToast('已添加 '+added+' 首'+(skipped?('，跳过 '+skipped+' 首（过大）'):''));
        else showToast('未能添加音乐'+(skipped?'（文件过大）':''));
    });
    _musicFileInput=input;return input;
}
function readFileAsDataURL(file){
    return new Promise(resolve=>{try{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve(null);r.readAsDataURL(file);}catch(e){resolve(null);}});
}

function confirmMusicLinks(){

    const lines=ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);

        const isDup=data.music.list.some(x=>(parsed.source==='netease'&&x.source==='netease'&&x.neteaseId===parsed.neteaseId)||(parsed.source==='link'&&x.source==='link'&&x.url===parsed.url));
        if(isDup){dup++;continue;}
        data.music.list.push({id:genId(),name:parsed.name,artist:'',url:parsed.url||'',neteaseId:parsed.neteaseId||'',source:parsed.source});
        added++;
    }

    let msg='成功添加 '+added+' 条';if(dup)msg+='，重复 '+dup+' 条';if(failed)msg+='，格式错误 '+failed+' 条';
    showToast(msg);

function testNeteasePlayable(id){
    return new Promise(resolve=>{
        const a=new Audio();a.preload='metadata';let settled=false;
        const done=ok=>{if(settled)return;settled=true;try{a.pause();a.removeAttribute('src');a.load();}catch(e){}resolve(ok);};
        a.addEventListener('canplay',()=>done(true),{once:true});
        a.addEventListener('loadedmetadata',()=>done(true),{once:true});
        a.addEventListener('error',()=>done(false),{once:true});
        setTimeout(()=>done(false),4000);
        try{a.src='https://music.163.com/song/media/outer/url?id='+id+'.mp3';a.load();}catch(e){done(false);}
    });
}
async function removeVipMusic(){
    const ns=data.music.list.filter(s=>s.source==='netease'&&s.neteaseId);
    if(!ns.length){showToast('没有网易云歌曲');return;}
    if(!confirm('将检测并删除无法播放的会员/付费歌曲，共 '+ns.length+' 首，确定继续？\n\n检测可能需要一些时间，请耐心等待。')) return;
    showToast('正在检测，请稍候...');
    const toRemove=new Set();
    for(const song of ns){const ok=await testNeteasePlayable(song.neteaseId);if(!ok)toRemove.add(song.id);}
    if(toRemove.size===0){showToast('没有发现无法播放的歌曲');return;}
    const curId=(data.music.currentIndex>=0&&data.music.list[data.music.currentIndex])?data.music.list[data.music.currentIndex].id:null;
    data.music.list=data.music.list.filter(s=>!toRemove.has(s.id));
    if(curId&&toRemove.has(curId)){silentPauseAudio();data.music.currentIndex=-1;}
    else if(curId) data.music.currentIndex=data.music.list.findIndex(s=>s.id===curId);
    saveData();if(musicPanelOpen)renderMusicPage();
    showToast('已删除 '+toRemove.size+' 首无法播放的歌曲');
}

function dedupeEmojis(){
    const emojis=Array.isArray(data.emojis)?data.emojis:[];
    if(emojis.length===0){showToast('还没有表情');return;}
    const seen=new Set();
    const kept=[];
    let removed=0;
    emojis.forEach(e=>{
        if(!e) return;
        const key=e.dataUrl?String(e.dataUrl):'';
        if(key){
            if(seen.has(key)){removed++;return;}
            seen.add(key);
        }
        kept.push(e);
    });
    if(removed>0){
        data.emojis=kept;
        saveNow();
        showToast('🧹 已自动删除 '+removed+' 个重复表情');
    }else{
        showToast('✅ 没有发现重复表情');
    }
    renderEmojiManagePage();
    renderEmojiGridPanel();
}
function compressEmojiImage(file,callback){
    try{
        const reader=new FileReader();
        reader.onload=ev=>{
            const raw=ev.target.result;
            const img=new Image();
            img.onload=()=>{
                try{
                    let w=img.naturalWidth||img.width;
                    let h=img.naturalHeight||img.height;
                    if(!w||!h){callback(raw);return;}
                    const maxDim=320;
                    if(w>maxDim||h>maxDim){
                        if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
                        else{w=Math.round(w*maxDim/h);h=maxDim;}
                    }
                    const c=document.createElement('canvas');
                    c.width=w;c.height=h;
                    const ctx=c.getContext('2d');
                    ctx.drawImage(img,0,0,w,h);
                    let out='';
                    try{out=c.toDataURL('image/webp',0.85);}catch(e){}
                    if(!out||out.indexOf('data:image/webp')!==0){
                        out=c.toDataURL('image/jpeg',0.85);
                    }
                    if(out.length>raw.length*0.95) out=raw;
                    callback(out);
                }catch(e){callback(raw);}
            };
            img.onerror=()=>callback(raw);
            img.src=raw;
        };
        reader.onerror=()=>callback(null);
        reader.readAsDataURL(file);
    }catch(e){callback(null);}
}
function importEmoji(){
    const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;
    input.onchange=function(e){
        const files=e.target.files;if(!files||!files.length) return;
        let loaded=0,added=0;
        const total=files.length;
        Array.from(files).forEach(file=>{
            compressEmojiImage(file,dataUrl=>{
                if(dataUrl){data.emojis.push({id:genId(),dataUrl});added++;}
                loaded++;
                if(loaded===total){
                    saveNow();
                    renderEmojiManagePage();
                    renderEmojiGridPanel();
                    showToast('已导入 '+added+' 个表情');
                }
            });
        });
    };
    input.click();
}

function toggleTextEmojiSwitch(key){

    if(key==='textEmojiEnabled') showToast(data.replySettings[key]?'已开启对方使用颜文字 / Emoji':'已关闭对方使用颜文字 / Emoji');

function addTextEmoji(){
    const input=document.getElementById('newTextEmojiInput');if(!input) return;
    const val=input.value.trim();if(!val){showToast('请输入内容');return;}
    if(!Array.isArray(data.textEmojis)) data.textEmojis=[];
    const items=val.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    const existing=new Set(data.textEmojis.map(e=>e.text));
    let added=0;
    items.forEach(t=>{if(existing.has(t))return;data.textEmojis.push({id:genId(),text:t});existing.add(t);added++;});
    saveData();renderTextEmojiPage();
    showToast(added>0?('已添加 '+added+' 条'):'内容已存在');
}
function deleteTextEmoji(id){if(!confirm('删除这条内容？')) return;data.textEmojis=(data.textEmojis||[]).filter(e=>e.id!==id);saveData();renderTextEmojiPage();showToast('已删除');}

function confirmBatchAddTextEmoji(){

function onWordCardSearch(value){
    wordCardSearch=value;
    const wrap=document.getElementById('wcSearchWrap');if(wrap)wrap.classList.toggle('has-text',!!value);
    const body=document.getElementById('wordCardBody');if(!body) return;
    let resultsHtml='';
    if(value&&value.trim()) resultsHtml=renderWordCardSearchResults(value.trim());
    else{renderWordCardPage();return;}
    const old=document.getElementById('wcSearchResults');
    if(old) old.innerHTML=resultsHtml;
    else{const c=document.createElement('div');c.id='wcSearchResults';c.innerHTML=resultsHtml;body.appendChild(c);}
}
function renderWordCardSearchResults(keyword){
    const kw=keyword.toLowerCase();const matches=[];
    (data.wordCards.groups||[]).forEach(g=>{(g.cards||[]).forEach(c=>{if(c&&c.word&&String(c.word).toLowerCase().indexOf(kw)>=0)matches.push({groupId:g.id,groupName:g.name,cardId:c.id,word:c.word,disabled:!!c.disabled,groupDisabled:!!g.disabled});});});
    let html='<div class="search-result-info"><span>找到 <b>'+matches.length+'</b> 条结果</span><span>关键词：'+esc(keyword)+'</span></div>';
    if(matches.length===0) html+='<div class="search-empty"><div style="font-size:36px;opacity:.4;margin-bottom:10px;">🔍</div><div>没有找到包含「'+esc(keyword)+'」的字卡</div></div>';
    else{
        matches.forEach(m=>{
            const disabled=(m.disabled||m.groupDisabled);
            html+='<div class="search-result-item"><div class="sri-text"><div class="sri-word'+(m.disabled?' wc-disabled':'')+'">'+highlightMatch(m.word,keyword)+(m.disabled?' <span class="wc-badge">已停用</span>':'')+'</div><div class="sri-group">分组：<span class="group-chip">📂 '+esc(m.groupName)+'</span>'+(m.groupDisabled?' <span class="wc-badge">分组停用</span>':'')+'</div></div><div class="sri-actions"><button onclick="toggleCardDisabled(\''+m.groupId+'\',\''+m.cardId+'\')" title="'+(m.disabled?'启用':'停用')+'">'+(m.disabled?'✅':'🚫')+'</button><button onclick="editCard(\''+m.groupId+'\',\''+m.cardId+'\')" title="编辑">✎</button><button onclick="deleteCardSearch(\''+m.groupId+'\',\''+m.cardId+'\')" title="删除">🗑</button><button onclick="gotoGroup(\''+m.groupId+'\')" title="查看分组">↗</button></div></div>';
        });
    }
    return html;
}
function clearWordCardSearch(){
    wordCardSearch='';
    const wrap=document.getElementById('wcSearchWrap');if(wrap)wrap.classList.remove('has-text');
    const inp=document.getElementById('wcSearchInput');if(inp)inp.value='';

function deleteCardSearch(groupId,cardId){
    if(!confirm('删除此字卡？')) return;

    group.cards=group.cards.filter(c=>c.id!==cardId);saveData();

function gotoGroup(groupId){

function toggleGroupDisabled(groupId){

function toggleCardDisabled(groupId,cardId){
    const g=(data.wordCards.groups||[]).find(x=>x.id===groupId);if(!g) return;
    const c=(g.cards||[]).find(x=>x.id===cardId);if(!c) return;
    c.disabled=!c.disabled;

        const old=document.getElementById('wcSearchResults');
        if(old) old.innerHTML=renderWordCardSearchResults(wordCardSearch.trim());

        showGroupDetail(groupId);

/* ===== 批量删除字卡 ===== */
function enterCardBatchMode(groupId){

    showGroupDetail(groupId);
}
function exitCardBatchMode(groupId){
    cardBatchMode=false;
    cardBatchSelected.clear();
    showGroupDetail(groupId);
}
function toggleCardSelect(groupId,cardId){
    if(!cardBatchMode) return;
    if(cardBatchSelected.has(cardId)) cardBatchSelected.delete(cardId);

function toggleSelectAllCards(groupId){
    const group=data.wordCards.groups.find(g=>g.id===groupId);

    if(cardBatchSelected.size===cards.length) cardBatchSelected.clear();

function deleteSelectedCards(groupId){
    const group=data.wordCards.groups.find(g=>g.id===groupId);
    if(!group) return;
    const n=cardBatchSelected.size;
    if(!n){showToast('请先勾选要删除的字卡');return;}
    if(!confirm('确定删除选中的 '+n+' 张字卡吗？此操作不可恢复！')) return;
    const ids=new Set(cardBatchSelected);
    group.cards=(group.cards||[]).filter(c=>!ids.has(c.id));
