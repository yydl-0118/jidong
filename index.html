            html+='<div class="letter-item" onclick="openLetterReader(\''+letter.id+'\')">'+badgeHtml+'<div class="li-head"><span class="li-from '+(letter.from==='partner'?'partner':'')+'">'+esc(fromLabel)+'</span><span class="li-time">'+formatDateTime(letter.timestamp)+'</span></div><div class="li-preview">'+esc(letter.content)+'</div>'+replyTag+'</div>';
        });
        html+='</div>';

    body.innerHTML=html;

function updateLetterSetting(key,val){
    const n=parseFloat(val);if(isNaN(n)) return;
    const s=data.letters.settings;
    if(key==='cardMin'||key==='cardMax'||key==='dailyLimitValue') s[key]=Math.max(0,Math.round(n));
    else s[key]=Math.max(0.1,n);
    saveData();renderLetterPage();
}
function updateLetterProb(key,val){
    const n=parseFloat(val);if(isNaN(n)) return;
    data.letters.settings[key]=Math.min(Math.max(n/100,0),1);saveData();showToast('已更新');
}
function toggleLetterAuto(){
    data.letters.settings.partnerAutoEnabled=!data.letters.settings.partnerAutoEnabled;
    saveData();renderLetterPage();
    showToast(data.letters.settings.partnerAutoEnabled?'已开启对方主动写信':'已关闭对方主动写信');
}

/* ===================== 占卜 ===================== */
function openDivination(){closePlusMenu();const panel=document.getElementById('divinationPanel');if(!panel) return;divinationOpen=true;panel.classList.add('open');renderDivinationPage();}
function closeDivination(){const panel=document.getElementById('divinationPanel');if(panel)panel.classList.remove('open');divinationOpen=false;}
function setDivType(t){divType=t;divDrawn=null;renderDivinationPage();}
function renderDivinationPage(){
    const body=document.getElementById('divBody');if(!body) return;
    let html='';
    html+='<div class="div-type-switch"><div class="div-type-btn '+(divType==='tarot'?'active':'')+'" onclick="setDivType(\'tarot\')"><span class="d-icon">🃏</span>塔罗牌 · 78张</div><div class="div-type-btn '+(divType==='lenormand'?'active':'')+'" onclick="setDivType(\'lenormand\')"><span class="d-icon">🌸</span>雷诺曼 · 36张</div></div>';
    if(!divDrawn){
        html+='<div class="div-label">写下你的问题</div><textarea id="divQuestionInput" class="div-input" rows="3" placeholder="例如：我和ta的未来发展如何？"></textarea><button class="div-draw-btn" onclick="drawDivination()">🔮 抽 3 张牌</button><div class="div-hint">静心思考你的问题，然后点击抽牌<br>'+(divType==='tarot'?'塔罗牌会有正位 / 逆位':'雷诺曼牌均为正位')+'</div>';
    }else{
        html+='<div class="div-label">你的问题</div><div class="div-result-box" style="margin-bottom:16px;color:#fff;font-size:14px;">'+esc(divDrawn.question)+'</div>';
        html+='<div class="div-card-row">';
        divDrawn.cards.forEach((c,i)=>{
            html+='<div class="div-card" style="animation-delay:'+(i*0.15)+'s;"><div class="card-pos">第 '+(i+1)+' 张</div><div class="card-icon"'+(c.reversed?' style="transform:rotate(180deg);"':'')+'>'+c.icon+'</div><div class="card-name">'+esc(c.name)+'</div>'+(divType==='tarot'?'<div class="card-orient '+(c.reversed?'rev':'up')+'">'+(c.reversed?'逆位':'正位')+'</div>':'')+'</div>';
        });
        html+='</div><div class="div-result-box">'+esc(divDrawn.text)+'</div><button class="div-copy-btn" onclick="copyDivination()">📋 复制结果文字</button><button class="div-reset-btn" onclick="resetDivination()">🔄 重新抽牌</button><div class="div-hint">占卜结果仅供娱乐参考 ✨</div>';
    }
    body.innerHTML=html;
    if(!divDrawn) setTimeout(()=>{const ta=document.getElementById('divQuestionInput');if(ta&&divQuestion)ta.value=divQuestion;},50);
}
function drawDivination(){
    const ta=document.getElementById('divQuestionInput');
    const q=ta?ta.value.trim():'';
    if(!q){showToast('请先写下你的问题');if(ta)ta.focus();return;}
    divQuestion=q;const cards=[];
    if(divType==='tarot'){
        const pool=TAROT_DECK.slice();
        for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
        pool.slice(0,3).forEach(c=>cards.push({name:c.name,icon:c.icon,suit:c.suit,reversed:Math.random()<0.5}));
    }else{
        const pool=LENORMAND_DECK.slice();
        for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
        pool.slice(0,3).forEach(c=>cards.push({name:c.n,icon:c.e,reversed:false}));
    }
    let text='【问题】'+q+'\n【牌阵】'+(divType==='tarot'?'塔罗牌 · 三张':'雷诺曼 · 三张')+'\n\n';
    cards.forEach((c,i)=>{const orient=(divType==='tarot'&&c.reversed)?'（逆位）':'';text+='第 '+(i+1)+' 张：'+c.name+orient+'\n';});
    text+='\n—— 悸动 · 占卜 ——';
    divDrawn={cards,question:q,text};renderDivinationPage();
}
function resetDivination(){divDrawn=null;renderDivinationPage();}
function copyDivination(){
    if(!divDrawn){showToast('还没有结果');return;}
    const txt=divDrawn.text;
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>showToast('✅ 已复制到剪贴板')).catch(()=>fallbackCopy(txt));
    else fallbackCopy(txt);
}
function fallbackCopy(txt){
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();
    try{const ok=document.execCommand('copy');showToast(ok?'✅ 已复制到剪贴板':'复制失败');}catch(e){showToast('复制失败');}
    document.body.removeChild(ta);
}

/* ===================== 🔍 查岗 ===================== */
const CLOCK_PLACE_GROUP='位置';
const CLOCK_ACTION_GROUP='干什么';
let clockState={
    open:false,
    direction:null,
    targetName:'',
    stage:'home',
    cardDir:null,
    firstCard:null,
    verifyCards:[],
    verifyStage:null,
    autoPickIdx:-1,
    retryCount:0,
    connectionResult:null,
    timers:[]
};
function clearClockTimers(){
    (clockState.timers||[]).forEach(t=>{try{clearTimeout(t);}catch(e){}});
    clockState.timers=[];
}
function addClockTimer(t){clockState.timers.push(t);return t;}

function ensureClockCards(){
    if(!data.clockCards||typeof data.clockCards!=='object') data.clockCards={place:[],action:[]};
    if(!Array.isArray(data.clockCards.place)) data.clockCards.place=[];
    if(!Array.isArray(data.clockCards.action)) data.clockCards.action=[];
    return data.clockCards;
}
function migrateClockCards(){
    ensureClockCards();
    if(!data.wordCards||!Array.isArray(data.wordCards.groups)) return false;
    let changed=false;
    const map=[{name:CLOCK_PLACE_GROUP,target:data.clockCards.place},{name:CLOCK_ACTION_GROUP,target:data.clockCards.action}];
    map.forEach(({name,target})=>{
        const g=data.wordCards.groups.find(x=>x&&x.name===name);
        if(!g) return;
        const existing=new Set(target.map(c=>String(c.word)));
        (g.cards||[]).forEach(c=>{
            const w=c&&c.word?String(c.word).trim():'';
            if(w&&!existing.has(w)){target.push({id:genId(),word:w});existing.add(w);}
        });
        data.wordCards.groups=data.wordCards.groups.filter(x=>x!==g);
        changed=true;
    });
    return changed;
}
function getClockCards(direction){
    ensureClockCards();
    const arr=direction==='place'?data.clockCards.place:data.clockCards.action;
    return arr.filter(c=>c&&c.word).map(c=>({word:c.word,id:c.id}));
}
function shuffleArray(arr){
    for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
}
function openClock(){
    closePlusMenu();
    if(plusPanelOpen) closePlusPanel();
    if(letterPanelOpen) closeLetter();
    if(musicPanelOpen) closeMusic();
    if(divinationOpen) closeDivination();
    ensureClockCards();
    saveData();
    const panel=document.getElementById('clockPanel');
    if(!panel) return;
    clearClockTimers();
    clockState={
        open:true,
        direction:null,
        targetName:data.partner.name||'',
        stage:'home',
        cardDir:null,
        firstCard:null,
        verifyCards:[],
        verifyStage:null,
        autoPickIdx:-1,
        retryCount:0,
        connectionResult:null,
        timers:[]
    };
    panel.classList.add('open');
    renderClockPage();
}
function closeClock(){
    clearClockTimers();
    const panel=document.getElementById('clockPanel');
    if(panel) panel.classList.remove('open');
    clockState.open=false;
}
function renderClockPage(){
    const body=document.getElementById('clockBody');
    if(!body) return;
    if(clockState.stage==='home') renderClockHome(body);
    else if(clockState.stage==='connecting') renderClockConnecting(body);
    else if(clockState.stage==='drawing') renderClockDrawing(body);
    else if(clockState.stage==='cards') renderClockCardsManage(body);
    else if(clockState.stage==='verify'){
        if(clockState.verifyStage==='pick') renderClockVerifyPick(body);
        else renderClockShuffle(body,'正在洗牌……');
    }
}
function renderClockHome(body){
    body.innerHTML=''+
        '<div class="clock-title">请点击你想查询对方的方向？</div>'+
        '<div class="clock-big-row">'+
            '<div class="clock-big-btn" onclick="clockChooseDirection(\'place\')"><div class="clock-big-icon">📍</div><div class="clock-big-text">在哪里</div></div>'+
            '<div class="clock-big-btn" onclick="clockChooseDirection(\'action\')"><div class="clock-big-icon">🎯</div><div class="clock-big-text">在干嘛</div></div>'+
        '</div>'+
        '<div class="clock-small-row">'+
            '<div class="clock-small-btn" onclick="openClockCardSetting(\'place\')"><span>📇</span> 位置字卡</div>'+
            '<div class="clock-small-btn" onclick="openClockCardSetting(\'action\')"><span>📇</span> 干什么字卡</div>'+
        '</div>'+
        '<div class="clock-tips">'+
            '<div class="clock-tips-title">📖 玩法说明</div>'+
            '<div class="clock-tips-text">点击「在哪里」或「在干嘛」需输入你想查看的人，开始连接后系统会随机给出：连接成功、链接不稳、对方正在忙、对方拒绝你的连接。开始查询约一秒后会给出二次认证，可以拒绝或者接受二次验证；二次验证由系统自动帮你抽牌，验证失败可以再次验证一次，查询两次都不对则判定为对方正在忙。<br><br>· 查岗字卡为独立字卡，<b>只在查岗中使用</b>，不会出现在聊天回复里。</div>'+
        '</div>';
}
function clockChooseDirection(dir){
    clockState.direction=dir;
    const dirName=dir==='place'?'在哪里':'在干嘛';
    const cards=getClockCards(dir);
    showModal('🔍 查岗 · '+dirName,
        '<label>请打出你想查询人的名字</label>'+
        '<input id="clockTargetInput" placeholder="输入对方名字" value="'+escAttr(clockState.targetName||data.partner.name||'')+'" autocomplete="off">'+
        '<div class="setting-sub" style="margin-top:8px;">将查询「'+dirName+'」方向，当前该方向有 <b>'+cards.length+'</b> 张查岗字卡</div>'+
        '<div class="modal-actions">'+
            '<button class="btn-cancel" onclick="closeModal()">取消</button>'+
            '<button class="btn-confirm" onclick="clockConfirmTarget()">确认</button>'+
        '</div>'
    );
    setTimeout(()=>{const inp=document.getElementById('clockTargetInput');if(inp)inp.focus();},100);
}
function clockConfirmTarget(){
    const input=document.getElementById('clockTargetInput');
    const name=input?input.value.trim():'';
    if(!name){showToast('请输入名字');return;}
    const cards=getClockCards(clockState.direction);
    if(cards.length===0){
        closeModal();
        showToast('该方向还没有查岗字卡，请先设置');
        openClockCardSetting(clockState.direction);
        return;
    }
    clockState.targetName=name;
    closeModal();
    startClockConnection();
}
function startClockConnection(){
    clockState.stage='connecting';
    clockState.connectionResult=null;
    renderClockPage();
    const t=setTimeout(()=>{
        const rand=Math.random();
        let result;
        if(rand<0.35) result='success';
        else if(rand<0.55) result='unstable';
        else if(rand<0.78) result='busy';
        else result='refused';
        clockState.connectionResult=result;
        renderClockPage();
    },2000);
    addClockTimer(t);
}
function renderClockConnecting(body){
    if(!clockState.connectionResult){
        body.innerHTML=''+
            '<div class="clock-connecting">'+
                '<div class="clock-spinner"></div>'+
                '<div class="clock-connecting-text">正在连接对方中……</div>'+
                '<div class="clock-connecting-sub">目标：'+esc(clockState.targetName)+'</div>'+
            '</div>';
        return;
    }
    const r=clockState.connectionResult;
    const map={
        success:{icon:'✅',text:'连接成功',cls:'success'},
        unstable:{icon:'📶',text:'链接不稳',cls:'unstable'},
        busy:{icon:'⏳',text:'对方正在忙',cls:'busy'},
        refused:{icon:'🚫',text:'对方拒绝连接',cls:'refused'}
    };
    const info=map[r];
    const canNext=(r==='success'||r==='unstable');
    body.innerHTML=''+
        '<div class="clock-result-box '+info.cls+'">'+
            '<div class="clock-result-icon">'+info.icon+'</div>'+
            '<div class="clock-result-text">'+info.text+'</div>'+
            (canNext
                ? '<button class="btn-primary" style="margin-top:26px;padding:12px 40px;" onclick="clockStartDraw()">开始查询</button>'
                : '<button class="btn-outline" style="margin-top:26px;padding:12px 40px;color:#fff;border-color:rgba(255,255,255,.3);" onclick="clockBackHome()">返回</button>')+
        '</div>';
}
function clockBackHome(){
    clearClockTimers();
    clockState.stage='home';
    clockState.direction=null;
    clockState.connectionResult=null;
    clockState.firstCard=null;
    clockState.verifyCards=[];
    clockState.verifyStage=null;
    clockState.autoPickIdx=-1;
    clockState.retryCount=0;
    clockState.cardDir=null;
    renderClockPage();
}
function clockStartDraw(){
    const cards=getClockCards(clockState.direction);
    if(cards.length===0){
        showToast('该方向还没有查岗字卡');
        openClockCardSetting(clockState.direction);
        return;
    }
    clockState.stage='drawing';
    clockState.firstCard=null;
    clockState.verifyCards=[];
    clockState.verifyStage=null;
    clockState.autoPickIdx=-1;
    renderClockPage();
    const t=setTimeout(()=>{
        const pick=cards[Math.floor(Math.random()*cards.length)];
        clockState.firstCard=pick;
        renderClockPage();
    },1600);
    addClockTimer(t);
}
function renderClockShuffle(body,text){
    body.innerHTML=''+
        '<div class="clock-shuffle">'+
            '<div class="clock-card-stack">'+
                '<div class="clock-card-back"></div>'+
                '<div class="clock-card-back"></div>'+
                '<div class="clock-card-back"></div>'+
            '</div>'+
            '<div class="clock-shuffle-text">'+esc(text||'正在洗牌……')+'</div>'+
        '</div>';
}
function renderClockDrawing(body){
    if(!clockState.firstCard){
        renderClockShuffle(body,'正在洗牌……');
        return;
    }
    body.innerHTML=''+
        '<div class="clock-draw-area">'+
            '<div class="clock-card-wrap">'+
                '<div class="clock-card" id="clockResultCard">⭐</div>'+
            '</div>'+
            '<button class="btn-primary" style="padding:12px 40px;" id="clockRevealBtn" onclick="clockRevealCard()">点击查看</button>'+
        '</div>';
}
function clockRevealCard(){
    const cardEl=document.getElementById('clockResultCard');
    if(cardEl&&clockState.firstCard){
        cardEl.classList.add('revealed');
        cardEl.innerHTML='<div class="clock-card-content">'+esc(clockState.firstCard.word)+'</div>';
    }
    const btn=document.getElementById('clockRevealBtn');
    if(btn) btn.style.display='none';
    const area=document.querySelector('.clock-draw-area');
    if(area&&!document.getElementById('clockBackBtn')){
        const backBtn=document.createElement('button');
        backBtn.id='clockBackBtn';
        backBtn.textContent='← 返回';
        backBtn.style.cssText='margin-top:18px;padding:10px 30px;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.7);font-size:14px;cursor:pointer;display:block;margin-left:auto;margin-right:auto;';
        backBtn.onclick=clockBackHome;
        area.appendChild(backBtn);
    }
    const t=setTimeout(()=>{showClockVerifyPrompt();},1000);
    addClockTimer(t);
}
function showClockVerifyPrompt(){
    const firstWord=clockState.firstCard?clockState.firstCard.word:'';
    showModal('🔍 二次验证',
        '<div class="clock-first-ref" style="margin-bottom:14px;">你这次抽到的牌：<b>'+esc(firstWord)+'</b></div>'+
        '<div style="text-align:center;padding:6px 0 8px;font-size:16px;font-weight:600;">是否进行二次验证？</div>'+
        '<div class="setting-sub" style="text-align:center;margin-bottom:6px;">二次验证由系统自动帮你抽牌，确保这个字卡是否是我们所需的</div>'+
        '<div class="modal-actions">'+
            '<button class="btn-cancel" onclick="closeModal()">取消</button>'+
            '<button class="btn-confirm" onclick="clockStartVerify()">确认</button>'+
        '</div>'
    );
}
function clockStartVerify(){
    closeModal();
    const cards=getClockCards(clockState.direction);
    if(cards.length<3){
        showModal('提示','<div style="text-align:center;padding:12px 0 16px;">该方向的查岗字卡不足 3 张，无法进行二次验证</div><div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">知道了</button></div>');
        return;
    }
    if(!clockState.firstCard){
        showToast('数据异常，请重新查询');
        clockBackHome();
        return;
    }
    const others=cards.filter(c=>c.id!==clockState.firstCard.id);
    shuffleArray(others);
    const two=others.slice(0,2);
    const three=[clockState.firstCard,...two];
    shuffleArray(three);
    clockState.verifyCards=three;
    clockState.verifyStage=null;
    clockState.autoPickIdx=-1;
    clockState.stage='verify';
    renderClockPage();
    const t=setTimeout(()=>{
        clockState.verifyStage='pick';
        renderClockPage();
        const t2=setTimeout(()=>{
            if(!clockState.open||clockState.stage!=='verify'||!clockState.verifyCards.length) return;
            const idx=Math.floor(Math.random()*clockState.verifyCards.length);
            clockAutoPickVerifyCard(idx);
        },1500);
        addClockTimer(t2);
    },1600);
    addClockTimer(t);
}
function renderClockVerifyPick(body){
    const firstWord=clockState.firstCard?clockState.firstCard.word:'';
    let html='<div class="clock-verify-title">系统正在自动验证…</div>';
    if(firstWord) html+='<div class="clock-verify-first-wrap"><div class="clock-verify-first">你之前抽到的牌：<b>'+esc(firstWord)+'</b></div></div>';
    html+='<div class="clock-verify-cards">';
    clockState.verifyCards.forEach((c,i)=>{
        const picked=clockState.autoPickIdx===i;
        html+='<div class="clock-verify-card'+(picked?' picked':'')+'" data-vid="'+i+'">'+(picked?esc(c.word):'⭐')+'</div>';
    });
    html+='</div>';
    html+='<div class="clock-auto-tip">'+(clockState.autoPickIdx>=0?'正在比对验证结果……':'无需手动选择，系统会自动从这 3 张牌中抽出 1 张进行验证')+'</div>';
    body.innerHTML=html;
}
function clockAutoPickVerifyCard(idx){
    const picked=clockState.verifyCards[idx];
    if(!picked||!clockState.firstCard) return;
    clockState.autoPickIdx=idx;
    renderClockPage();
    const isMatch=picked.id===clockState.firstCard.id;
    const firstWord=clockState.firstCard.word;
    const t=setTimeout(()=>{
        if(isMatch){
            showModal('✅ 验证成功',
                '<div class="clock-first-ref">你之前抽到的牌：<b>'+esc(firstWord)+'</b></div>'+
                '<div class="clock-picked-card">'+esc(picked.word)+'</div>'+
                '<div class="clock-picked-hint" style="color:#10b981;">系统自动验证结果与首次一致，可信度较高</div>'+
                '<div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">完成</button></div>'
            );
        }else{
            clockState.retryCount++;
            const isFinal=clockState.retryCount>=2;
            if(isFinal){
                showModal('😔 验证失败',
                    '<div class="clock-first-ref">你之前抽到的牌：<b>'+esc(firstWord)+'</b></div>'+
                    '<div class="clock-picked-card">'+esc(picked.word)+'</div>'+
                    '<div class="clock-picked-hint" style="color:#ef4444;font-weight:600;">系统自动验证两次均不一致，对方可能在忙，请稍后重试</div>'+
                    '<div class="modal-actions"><button class="btn-confirm" onclick="closeModal();clockBackHome();">知道了</button></div>'
                );
            }else{
                showModal('🤔 验证不一致',
                    '<div class="clock-first-ref">你之前抽到的牌：<b>'+esc(firstWord)+'</b></div>'+
                    '<div class="clock-picked-card">'+esc(picked.word)+'</div>'+
                    '<div class="clock-picked-hint">系统自动验证结果与首次不一致，是否重新验证一次？</div>'+
                    '<div class="modal-actions">'+
                        '<button class="btn-cancel" onclick="closeModal();clockBackHome();">取消</button>'+
                        '<button class="btn-confirm" onclick="clockRetry()">重新验证</button>'+
                    '</div>'
                );
            }
        }
    },700);
    addClockTimer(t);
}
function clockRetry(){
    closeModal();
    const cards=getClockCards(clockState.direction);
    if(cards.length===0){showToast('该方向还没有查岗字卡');clockBackHome();return;}
    clockStartDraw();
}

/* --- 查岗字卡管理页 --- */
function openClockCardSetting(direction){
    ensureClockCards();
    clockState.cardDir=direction;
    clockState.stage='cards';
    renderClockPage();
}
function clockCardsBack(){
    clockState.stage='home';
    clockState.cardDir=null;
    renderClockPage();
}
function renderClockCardsManage(body){
    ensureClockCards();
    const dir=clockState.cardDir||'place';
    const isPlace=dir==='place';
    const list=isPlace?data.clockCards.place:data.clockCards.action;
    const title=isPlace?'📍 位置字卡':'🎯 干什么字卡';
    let html='';
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">';

function clockAddCard(){
    const inp=document.getElementById('clockNewCardInput');
    if(!inp) return;
    const val=inp.value.trim();
    if(!val){showToast('请输入内容');return;}
    ensureClockCards();
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const words=val.split(/[,，\n]+/).map(s=>s.trim()).filter(Boolean);
    const existing=new Set(list.map(c=>c.word));
    let added=0,skipped=0;
    words.forEach(w=>{
        if(existing.has(w)){skipped++;return;}
        list.push({id:genId(),word:w});existing.add(w);added++;
    });
    saveData();
    renderClockCardsManage(document.getElementById('clockBody'));
    if(added) showToast('已添加 '+added+' 张'+(skipped?'，跳过 '+skipped+' 张重复':''));
    else showToast('内容已存在');
}
function openClockBatchAdd(){
    const dir=clockState.cardDir||'place';
    const title=(dir==='place'?'📍 位置字卡':'🎯 干什么字卡')+' · 批量添加';
    showModal(title,
        '<label>每行一条，也可用逗号分隔</label>'+
        '<textarea id="clockBatchInput" rows="8" placeholder="家里&#10;公司&#10;学校&#10;超市, 餐厅, 公园"></textarea>'+
        '<div class="setting-sub">重复内容会自动跳过</div>'+
        '<div class="modal-actions">'+
            '<button class="btn-cancel" onclick="closeModal()">取消</button>'+
            '<button class="btn-confirm" onclick="clockConfirmBatchAdd()">导入</button>'+
        '</div>'
    );
    setTimeout(()=>{const ta=document.getElementById('clockBatchInput');if(ta)ta.focus();},80);
}
function clockConfirmBatchAdd(){
    const ta=document.getElementById('clockBatchInput');
    if(!ta) return;
    const raw=ta.value;
    const lines=raw.split(/[\n,，;；]+/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length){showToast('请输入内容');return;}
    ensureClockCards();
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const existing=new Set(list.map(c=>String(c.word)));
    let added=0,skipped=0;
    lines.forEach(w=>{
        if(existing.has(w)){skipped++;return;}
        list.push({id:genId(),word:w});existing.add(w);added++;
    });
    saveData();closeModal();
    renderClockCardsManage(document.getElementById('clockBody'));
    if(added) showToast('✅ 新增 '+added+' 张'+(skipped?'，跳过 '+skipped+' 张重复':''));
    else showToast('内容已存在，未新增');
}
function clockDeleteCard(id){
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const idx=list.findIndex(c=>c.id===id);
    if(idx<0) return;
    if(!confirm('删除这张查岗字卡？')) return;
    list.splice(idx,1);saveData();
    renderClockCardsManage(document.getElementById('clockBody'));
    showToast('已删除');
}
function clockEditCard(id){
    const dir=clockState.cardDir||'place';
    const list=dir==='place'?data.clockCards.place:data.clockCards.action;
    const card=list.find(c=>c.id===id);
    if(!card) return;
    const nv=prompt('编辑查岗字卡：',card.word);
    if(nv===null) return;
    const w=nv.trim();
    if(!w){showToast('内容不能为空');return;}
    if(list.some(c=>c.word===w&&c.id!==id)){showToast('⚠️ 该字卡已存在');return;}
    card.word=w;saveData();
    renderClockCardsManage(document.getElementById('clockBody'));
    showToast('已更新');
}

function initCallMiniDrag(){
    const mini=document.getElementById('callMini');if(!mini) return;
    let drag=null;
    const getPoint=e=>{if(e.touches&&e.touches[0])return e.touches[0];if(e.changedTouches&&e.changedTouches[0])return e.changedTouches[0];return e;};
    const onStart=e=>{const pt=getPoint(e),rect=mini.getBoundingClientRect();drag={offsetX:pt.clientX-rect.left,offsetY:pt.clientY-rect.top,startX:pt.clientX,startY:pt.clientY,moved:false};mini.classList.add('dragging');if(e.cancelable)e.preventDefault();};
    const onMove=e=>{if(!drag)return;const pt=getPoint(e);if(Math.abs(pt.clientX-drag.startX)>5||Math.abs(pt.clientY-drag.startY)>5)drag.moved=true;const x=pt.clientX-drag.offsetX,y=pt.clientY-drag.offsetY;const w=mini.offsetWidth,h=mini.offsetHeight;const maxX=Math.max(0,window.innerWidth-w),maxY=Math.max(0,window.innerHeight-h);mini.style.left=Math.max(0,Math.min(maxX,x))+'px';mini.style.top=Math.max(0,Math.min(maxY,y))+'px';mini.style.right='auto';mini.style.bottom='auto';if(e.cancelable)e.preventDefault();};
    const onEnd=()=>{if(!drag)return;const moved=drag.moved;drag=null;mini.classList.remove('dragging');if(!moved)restoreCall();};
    mini.addEventListener('touchstart',onStart,{passive:false});
    mini.addEventListener('touchmove',onMove,{passive:false});
    mini.addEventListener('touchend',onEnd);mini.addEventListener('touchcancel',onEnd);
    mini.addEventListener('mousedown',onStart);
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);
}
